name: Release v1.10.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v1.10.0.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Bump coordinated app versions
        shell: python
        run: |
          from pathlib import Path
          replacements = {
            'guidon-app/package.json': [('"version": "1.9.0"', '"version": "1.10.0"')],
            'guidon-app/src-tauri/tauri.conf.json': [('"version": "1.9.0"', '"version": "1.10.0"')],
            'guidon-app/src-tauri/Cargo.toml': [('version = "1.9.0"', 'version = "1.10.0"')],
            'guidon-app/android/app/build.gradle': [('versionCode 10900', 'versionCode 11000'), ('versionName "1.9.0"', 'versionName "1.10.0"')],
            'GUIDON files/ROADMAP.md': [('**Current version:** v1.9.0 (`guidon-app/package.json`), cut 2026-09-15', '**Current version:** v1.10.0 (`guidon-app/package.json`), cut 2026-09-16')],
          }
          for filename, pairs in replacements.items():
            p = Path(filename)
            text = p.read_text(encoding='utf-8')
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f'expected release marker not found in {filename}: {old}')
              text = text.replace(old, new, 1)
            p.write_text(text, encoding='utf-8')
      - name: Refresh Rust lockfile
        working-directory: guidon-app/src-tauri
        run: cargo check
      - name: Verify version markers
        run: |
          grep -q '"version": "1.10.0"' guidon-app/package.json
          grep -q '"version": "1.10.0"' guidon-app/src-tauri/tauri.conf.json
          grep -q 'version = "1.10.0"' guidon-app/src-tauri/Cargo.toml
          grep -q 'name = "guidon"' guidon-app/src-tauri/Cargo.lock
          grep -A2 'name = "guidon"' guidon-app/src-tauri/Cargo.lock | grep -q 'version = "1.10.0"'
          grep -q 'versionCode 11000' guidon-app/android/app/build.gradle
          grep -q 'versionName "1.10.0"' guidon-app/android/app/build.gradle
      - name: Commit release bump
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/release-v1.10.0.yml
          git add guidon-app/package.json guidon-app/src-tauri/tauri.conf.json guidon-app/src-tauri/Cargo.toml guidon-app/src-tauri/Cargo.lock guidon-app/android/app/build.gradle 'GUIDON files/ROADMAP.md'
          git commit -m 'chore(release): bump GUIDON to v1.10.0'
          git tag -a v1.10.0 -m 'GUIDON v1.10.0'
          git push origin HEAD:main
          git push origin v1.10.0
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.10.0 --title 'GUIDON v1.10.0' --generate-notes
