name: Release assets

# Publishes the installable native release artifacts that GitHub Pages does not
# cover. The PWA and iOS verification remain owned by pages.yml and ios.yml.
#
# Important: release binaries are built from the version tag, not from the
# trigger commit on main. A main-branch release trigger can therefore safely
# fan out the already-cut release without making the binaries drift past it.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'guidon-app/src/.release-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve package version and require published release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./guidon-app/package.json').version")"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          git rev-parse "${TAG}^{commit}" >/dev/null
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "Publishing native assets for ${TAG}"

  android:
    name: Android signed APK + AAB
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: guidon-app
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: guidon-app/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Install Chromium for icon generation
        run: npx playwright install --with-deps chromium

      - name: Generate icons
        run: npm run icons

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.GUIDON_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.GUIDON_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.GUIDON_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.GUIDON_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing Android signing secret: ${name}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          mkdir -p android/keys
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/keys/guidon-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=keys/guidon-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build signed APK + AAB
        run: npm run android:release

      - name: Verify signatures and signing-key continuity
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify -strict "$AAB"

          # v1.9.0 is the immediately previous shipped Android release. Refuse
          # to publish an APK signed by a different key because Android would
          # reject it as an update over users' existing installs.
          mkdir -p /tmp/guidon-prior
          gh release download v1.9.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'GUIDON-1.9.0-android.apk' --dir /tmp/guidon-prior
          PRIOR="/tmp/guidon-prior/GUIDON-1.9.0-android.apk"
          prior_digest="$("$APKSIGNER" verify --print-certs "$PRIOR" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          new_digest="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$prior_digest" && test -n "$new_digest"
          if [ "$prior_digest" != "$new_digest" ]; then
            echo "::error::Android signing certificate does not match v1.9.0; refusing an update-incompatible release."
            exit 1
          fi
          echo "Android signing continuity verified: ${new_digest}"

      - name: Publish Android assets to GitHub Release
        run: |
          set -euo pipefail
          mkdir -p release-out
          cp android/app/build/outputs/apk/release/app-release.apk "release-out/GUIDON-${VERSION}-android.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release-out/GUIDON-${VERSION}-android.aab"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "release-out/GUIDON-${VERSION}-android.apk" \
            "release-out/GUIDON-${VERSION}-android.aab"

  windows:
    name: Windows MSI + setup EXE
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: guidon-app
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: guidon-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for icon generation
        run: npx playwright install chromium

      - name: Generate icons
        run: npm run icons

      - name: Build web bundle
        run: npm run build

      - name: Build Windows release installers
        run: npx tauri build --ci

      - name: Publish Windows assets to GitHub Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-out | Out-Null
          $nsis = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' | Select-Object -First 1
          if (-not $nsis) { throw 'NSIS setup executable not found' }
          if (-not $msi) { throw 'MSI installer not found' }
          $setupOut = "release-out/GUIDON-$env:VERSION-windows-setup.exe"
          $msiOut = "release-out/GUIDON-$env:VERSION-windows.msi"
          Copy-Item $nsis.FullName $setupOut
          Copy-Item $msi.FullName $msiOut
          gh release upload $env:TAG --repo $env:GITHUB_REPOSITORY --clobber $setupOut $msiOut
