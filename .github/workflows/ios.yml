# GUIDON — iOS fork: build + Simulator verification
#
# COST: $0. GitHub-hosted macOS runners are free with unlimited minutes on
# PUBLIC repositories. The-Guidon is public, so this pipeline never bills.
# If this repo is ever flipped to private, macOS minutes bill at a 10x
# multiplier — disable this workflow in the same commit.
#
# NO APPLE DEVELOPER ACCOUNT IS REQUIRED. Simulator slices need no certificate
# and no provisioning profile, which is what CODE_SIGNING_ALLOWED=NO buys. The
# $99/yr account only becomes necessary for TestFlight or the App Store.
#
# WHAT IT DOES
#   1. Builds web/ from src/index.html exactly as the Android fork does — the
#      same npm run build, the same bundle. iOS adds no build plumbing.
#   2. Generates (or reuses) the Capacitor iOS project.
#   3. Compiles for the iOS Simulator with signing disabled.
#   4. Boots real iOS Simulators, installs, launches, and PROVES the WKWebView
#      actually painted (tools/ios-simulator-run.sh + tools/png-render-check.py).
#   5. Uploads screenshots, system logs and crash reports as artifacts.
#
# This is the emulator suite for a Windows developer: no Mac is ever touched,
# and every push produces real WKWebView-on-real-iOS-Simulator evidence.
#
# FIRST RUN: leave ios/ out of the repo. The bootstrap step generates it and
# uploads it as the `ios-project-bootstrap` artifact. Download, unzip into
# guidon-app/ios/, commit from Windows. Every run after that reuses it, so
# native config (Info.plist, icons, launch screen) survives.

name: iOS

on:
  workflow_dispatch:
    inputs:
      devices:
        description: 'Comma-separated Simulator device names'
        required: false
        default: 'iPhone SE (3rd generation),iPhone 16,iPhone 16 Pro Max,iPad (10th generation)'
  push:
    branches: [main]
    paths:
      - 'guidon-app/src/**'
      - 'guidon-app/tools/**'
      - 'guidon-app/package.json'
      - 'guidon-app/package-lock.json'
      - 'guidon-app/capacitor.config.json'
      - 'guidon-app/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'guidon-app/src/**'
      - 'guidon-app/capacitor.config.json'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ID: app.guidon.trainer
  # Must match the Android fork's @capacitor/core major.
  CAP_MAJOR: '8'
  DEFAULT_DEVICES: 'iPhone SE (3rd generation),iPhone 16,iPhone 16 Pro Max,iPad (10th generation)'

defaults:
  run:
    shell: bash
    working-directory: guidon-app

jobs:
  # ---------------------------------------------------------------------------
  # Layer 1 — WebKit on a Linux runner. Same engine family as WKWebView, catches
  # layout/CSS/JS defects in ~1 minute without touching a macOS runner.
  #
  # Its limits are known and deliberate: Playwright's WebKit is the ENGINE, not
  # Apple's platform. Measured on this build, navigator.storage, navigator.share,
  # Notification and the Fullscreen API are all absent there while
  # isSecureContext is true — so capability questions are NOT settled here. They
  # are settled on the Simulator below. This job owns rendering; that job owns
  # capability.
  # ---------------------------------------------------------------------------
  webkit:
    name: WebKit pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: guidon-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # make-icons.mjs renders the icon set through Chromium, so both engines are
      # needed here even though the verification itself is WebKit-only.
      - name: Install browsers
        run: npx playwright install --with-deps webkit chromium

      # All four static lints (lint-patterns, lint-ci-matrix, lint-capacitor-
      # config, lint-engine-floor) before anything is built: an unguarded
      # feature above the engine floor (Chromium 111 / WebKit 16.2 / Gecko 113,
      # tools/engine-floor.json - collective Q11) fails here in seconds instead
      # of surfacing as a blank WKWebView on the Simulator two jobs later.
      - name: Static lints
        run: npm run lint:patterns

      # web/ is gitignored and web/icons/ is generated by a separate script that
      # `npm test` does not call. Without this the bundle ships no icons, the
      # manifest 404s, and the run fails on console noise rather than on anything
      # real. Verified locally: 22 pass / 5 fail without it, 27 pass / 0 fail with.
      # No GUIDON_CAPS_PROBE here: verify-ios-webkit.mjs collects its probe via
      # #/selftest?probe=1 (tools/caps-probe.mjs), and a build stamped with the
      # flag prints the once-per-page sentinel at load, before that listener
      # is armed - measured: the collector then times out with no probe file.
      - name: Build web bundle
        run: |
          npm run build
          npm run icons

      # Reports the defect list as evidence without failing the run while Tier 0
      # is still open. Remove continue-on-error once ios:verify exits 0, so this
      # becomes a real regression gate rather than a report.
      - name: iOS WebKit verification
        continue-on-error: true
        run: npm run ios:verify:shots

      - name: Upload WebKit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-webkit-shots
          path: guidon-app/artifacts/ios-webkit/
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Layer 2 — the truth loop. Real Xcode, real Simulator, real WKWebView.
  # ---------------------------------------------------------------------------
  simulator:
    name: Build + Simulator verify
    # macos-latest keeps this on a supported image automatically. Pin to a
    # specific label (macos-15, macos-26, ...) once a build is known-good and
    # Xcode version stability matters more than staying current.
    runs-on: macos-latest
    timeout-minutes: 45
    # NOT gated on the webkit job, deliberately. ios:verify exits non-zero today
    # (12 open defects at v1.5.0), so `needs: webkit` would make this job unreachable and
    # the pipeline could never produce the ios-project-bootstrap artifact the
    # very first run exists to produce. Add the gate back once Tier 0 lands and
    # ios:verify is green.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: guidon-app/package-lock.json

      - name: Show toolchain
        run: |
          echo "node    $(node -v)"
          echo "npm     $(npm -v)"
          echo "xcode   $(xcodebuild -version | tr '\n' ' ')"
          echo "python  $(python3 --version)"
          echo "sims    $(xcrun simctl list runtimes | grep -c iOS || true) iOS runtime(s)"

      - name: Install dependencies
        run: npm ci

      # The web bundle IS the app. tools/build.mjs fails loudly on any anchor
      # that does not match exactly once, so a green build here is meaningful.
      # GUIDON_CAPS_PROBE=1 stamps window.GUIDON_CAPS_PROBE = true into web/
      # (tools/build.mjs) so the page prints the GUIDON_CAPS sentinel once at
      # load - the only probe path where nobody can type a hash - and
      # tools/ios-simulator-run.sh reads it off the Simulator console into
      # artifacts/ios/<device>/caps.json.
      - name: Build web bundle
        env:
          GUIDON_CAPS_PROBE: "1"
        run: |
          npm run build
          npx playwright install chromium   # make-icons.mjs renders through it
          npm run icons

      - name: Verify web/ exists
        run: |
          test -f web/index.html || { echo "::error::web/index.html missing after build"; exit 1; }
          # No apple-touch-icon gate here: that file serves the PWA fork. The
          # native app's icon comes from ios/App/App/Assets.xcassets, which is
          # committed with the project and untouched by cap sync.
          echo "web bundle: $(du -sh web | cut -f1)"

      # -----------------------------------------------------------------------
      # Capacitor iOS platform
      # -----------------------------------------------------------------------
      - name: Add @capacitor/ios
        run: |
          if ! node -e "require.resolve('@capacitor/ios/package.json')" 2>/dev/null; then
            echo "Installing @capacitor/ios@^${CAP_MAJOR}"
            npm install --no-save "@capacitor/ios@^${CAP_MAJOR}"
          fi
          node -e "console.log('@capacitor/ios', require('@capacitor/ios/package.json').version)"

      - name: Bootstrap iOS project (first run only)
        id: bootstrap
        run: |
          if [ -d ios/App ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Reusing committed ios/ project."
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "No ios/ in repo - generating a fresh Capacitor iOS project."
            npx cap add ios
          fi

      - name: Sync web assets and plugins into iOS
        run: npx cap sync ios

      # -----------------------------------------------------------------------
      # Compile.
      #
      # Capacitor 8 defaults to Swift Package Manager, and an SPM project has NO
      # App.xcworkspace — only App.xcodeproj plus App/CapApp-SPM/Package.swift.
      # (Verified against the shipped templates in
      #  node_modules/@capacitor/cli/assets/: ios-spm-template has no
      #  .xcworkspace; only ios-pods-template does.) Hard-coding `-workspace
      #  ios/App/App.xcworkspace` therefore fails outright on a default Cap 8
      #  project, so the container is detected rather than assumed.
      #
      # Destination is a CONCRETE simulator, not `generic/platform=iOS Simulator`:
      # a generic destination builds an unintalled-product slice, and on Apple
      # Silicon runners the arch selection is exactly where a "builds fine, will
      # not install" mismatch hides. Building for a real device id keeps the
      # compiled slice and the install target the same thing.
      # -----------------------------------------------------------------------
      - name: Pick a build destination
        id: dest
        run: |
          set -euo pipefail
          # Self-test first: this picker has a version-comparison bug class that
          # only shows up when an old runtime is installed alongside a new one
          # (string-sorting ranks iOS-9-0 above iOS-18-0). Cheap to assert.
          python3 tools/ios-pick-simulator.py --selftest
          UDID="$(xcrun simctl list devices available -j | python3 tools/ios-pick-simulator.py --match iPhone)" || true
          if [ -z "${UDID:-}" ]; then
            echo "::error::no available iPhone simulator to build against"
            xcrun simctl list devices available || true
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Building against simulator $UDID"

      - name: Build for iOS Simulator
        env:
          DEST_UDID: ${{ steps.dest.outputs.udid }}
        run: |
          set -euo pipefail

          # Detect the project container. SPM -> .xcodeproj, CocoaPods -> .xcworkspace.
          if [ -d ios/App/App.xcworkspace ]; then
            CONTAINER=(-workspace ios/App/App.xcworkspace)
            echo "container: App.xcworkspace (CocoaPods)"
          elif [ -d ios/App/App.xcodeproj ]; then
            CONTAINER=(-project ios/App/App.xcodeproj)
            echo "container: App.xcodeproj (SPM)"
          else
            echo "::error::neither ios/App/App.xcworkspace nor ios/App/App.xcodeproj exists"
            ls -la ios/App || true
            exit 1
          fi

          # xcbeautify ships on the GitHub macOS images, but a missing formatter
          # must never be the reason a build "fails".
          if command -v xcbeautify >/dev/null 2>&1; then
            FORMAT=(xcbeautify --renderer github-actions)
          else
            FORMAT=(cat)
          fi

          set -o pipefail
          xcodebuild \
            "${CONTAINER[@]}" \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${DEST_UDID}" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | "${FORMAT[@]}"

      # Uploaded AFTER the build on purpose: SPM resolution during xcodebuild
      # writes Package.resolved, and the committed project must carry that pin
      # or every later run resolves capacitor-swift-pm afresh. include-hidden-
      # files because v4 drops dotfiles by default and the template's own
      # .gitignore is one; App/App/public is 12+ MB of web bundle that cap sync
      # regenerates and must not be committed.
      - name: Upload generated iOS project for committing
        if: steps.bootstrap.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-project-bootstrap
          include-hidden-files: true
          path: |
            guidon-app/ios
            !guidon-app/ios/App/Pods
            !guidon-app/ios/App/build
            !guidon-app/ios/App/DerivedData
            !guidon-app/ios/App/App/public
          retention-days: 14

      - name: Locate built app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find ios/build/Build/Products -maxdepth 2 -name 'App.app' -type d | head -1)"
          test -n "$APP_PATH" || { echo "::error::App.app not found under ios/build/Build/Products"; find ios/build -maxdepth 4 -name '*.app' || true; exit 1; }
          echo "path=$PWD/$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Built: $APP_PATH ($(du -sh "$APP_PATH" | cut -f1))"

      # -----------------------------------------------------------------------
      # Boot real Simulators and prove the app launches AND renders. A build that
      # compiles but shows a blank WKWebView is the classic Capacitor-on-iOS
      # failure; the pixels are the only honest check.
      # -----------------------------------------------------------------------
      - name: Run on Simulators
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
          BUNDLE_ID: ${{ env.APP_ID }}
          DEVICES: ${{ github.event.inputs.devices || env.DEFAULT_DEVICES }}
        run: bash tools/ios-simulator-run.sh

      - name: Upload Simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-evidence
          path: guidon-app/artifacts/ios/
          retention-days: 30
          if-no-files-found: warn

      # The capability probe files alone (one per device), for a Windows
      # developer to drop into guidon-app/artifacts/ios/<device>/caps.json and
      # feed `npm run caps:matrix` (columns labelled simulator, never evidence).
      - name: Upload Simulator capability probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-caps
          path: guidon-app/artifacts/ios/**/caps.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload .app for manual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guidon-ios-simulator-app
          path: ${{ steps.app.outputs.path }}
          retention-days: 30
          if-no-files-found: warn
