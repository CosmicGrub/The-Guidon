# GUIDON — iOS fork: build + WebKit/Simulator parity verification
# The web bundle is the app; this workflow proves the maintained Capacitor iOS
# project still compiles and renders that same bundle on representative devices.

name: iOS

on:
  workflow_dispatch:
    inputs:
      devices:
        description: 'Comma-separated Simulator device names'
        required: false
        default: 'iPhone SE (3rd generation),iPhone 16,iPhone 16 Pro Max,iPad (10th generation)'
  push:
    branches: [main]
    paths:
      - 'guidon-app/src/**'
      - 'guidon-app/tools/**'
      - 'guidon-app/package.json'
      - 'guidon-app/package-lock.json'
      - 'guidon-app/capacitor.config.json'
      - 'guidon-app/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'guidon-app/src/**'
      - 'guidon-app/tools/**'
      - 'guidon-app/package.json'
      - 'guidon-app/package-lock.json'
      - 'guidon-app/capacitor.config.json'
      - 'guidon-app/ios/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ID: app.guidon.trainer
  CAP_MAJOR: '8'
  DEFAULT_DEVICES: 'iPhone SE (3rd generation),iPhone 16,iPhone 16 Pro Max,iPad (10th generation)'

defaults:
  run:
    shell: bash
    working-directory: guidon-app

jobs:
  webkit:
    name: WebKit pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: guidon-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps webkit chromium
      - name: Static lints
        run: npm run lint:patterns
      - name: Build web bundle
        run: |
          npm run build
          npm run icons
      # A REAL gate again. This step ran with `continue-on-error: true` for
      # weeks because the verifier always exited 1 on a backlog of known
      # layout defects - so the job was green whatever it found, and the only
      # layout / tap-target / zoom-on-focus check for the iPhone fork decided
      # nothing. It was meant to be temporary; the note saying so was later
      # deleted and the defect count kept growing unseen. The backlog is now
      # written down in guidon-app/tools/ios-webkit-baseline.json and
      # tolerated; ANY defect that is not on that list fails this step. The
      # list may only shrink (the run says when a line can be deleted). Do
      # not put continue-on-error back: fix the new defect instead.
      # tools/test-release-pipeline.mjs asserts this step stays blocking.
      - name: iOS WebKit verification
        run: npm run ios:verify:shots
      - name: Upload WebKit screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-webkit-shots
          path: guidon-app/artifacts/ios-webkit/
          retention-days: 14
          if-no-files-found: warn

  simulator:
    name: Build + Simulator verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: guidon-app/package-lock.json

      - name: Show toolchain
        run: |
          echo "node    $(node -v)"
          echo "npm     $(npm -v)"
          echo "xcode   $(xcodebuild -version | tr '\n' ' ')"
          echo "python  $(python3 --version)"
          echo "sims    $(xcrun simctl list runtimes | grep -c iOS || true) iOS runtime(s)"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        env:
          GUIDON_CAPS_PROBE: '1'
        run: |
          npm run build
          npx playwright install chromium
          npm run icons
          test -f web/index.html

      - name: Ensure Capacitor iOS dependency
        run: |
          if ! node -e "require.resolve('@capacitor/ios/package.json')" 2>/dev/null; then
            npm install --no-save "@capacitor/ios@^${CAP_MAJOR}"
          fi
          node -e "console.log('@capacitor/ios', require('@capacitor/ios/package.json').version)"

      - name: Require maintained iOS project
        run: |
          test -d ios/App/App.xcodeproj || { echo '::error::maintained ios/App/App.xcodeproj is missing'; exit 1; }

      - name: Sync web assets and plugins into iOS
        run: npx cap sync ios

      - name: Pick build destination
        id: dest
        run: |
          set -euo pipefail
          python3 tools/ios-pick-simulator.py --selftest
          UDID="$(xcrun simctl list devices available -j | python3 tools/ios-pick-simulator.py --match iPhone)"
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Building against simulator $UDID"

      - name: Build for iOS Simulator
        env:
          DEST_UDID: ${{ steps.dest.outputs.udid }}
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            CONTAINER=(-workspace ios/App/App.xcworkspace)
          else
            CONTAINER=(-project ios/App/App.xcodeproj)
          fi
          if command -v xcbeautify >/dev/null 2>&1; then
            FORMAT=(xcbeautify --renderer github-actions)
          else
            FORMAT=(cat)
          fi
          set -o pipefail
          xcodebuild \
            "${CONTAINER[@]}" \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${DEST_UDID}" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | "${FORMAT[@]}"

      - name: Locate built app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find ios/build/Build/Products -maxdepth 2 -name 'App.app' -type d | head -1)"
          test -n "$APP_PATH" || { echo '::error::App.app not found'; exit 1; }
          echo "path=$PWD/$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Built: $APP_PATH ($(du -sh "$APP_PATH" | cut -f1))"

      - name: Run on Simulators
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
          BUNDLE_ID: ${{ env.APP_ID }}
          DEVICES: ${{ github.event.inputs.devices || env.DEFAULT_DEVICES }}
        run: bash tools/ios-simulator-run-with-retry.sh

      - name: Upload Simulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-simulator-evidence
          path: guidon-app/artifacts/ios/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Simulator capability probes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-simulator-caps
          path: guidon-app/artifacts/ios/**/caps.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload .app for manual inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guidon-ios-simulator-app
          path: ${{ steps.app.outputs.path }}
          retention-days: 30
          if-no-files-found: warn
