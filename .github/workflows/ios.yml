# GUIDON — iOS fork: build + WebKit/Simulator parity verification
# The web bundle is the app; this workflow proves the maintained Capacitor iOS
# project still compiles and renders that same bundle on representative devices.

name: iOS

on:
  workflow_dispatch:
    inputs:
      devices:
        description: 'Comma-separated Simulator device names'
        required: false
        default: 'iPhone SE (3rd generation),iPhone 16,iPhone 16 Pro Max,iPad (10th generation)'
  push:
    branches: [main]
    paths:
      - 'guidon-app/src/**'
      - 'guidon-app/tools/**'
      - 'guidon-app/package.json'
      - 'guidon-app/package-lock.json'
      - 'guidon-app/capacitor.config.json'
      - 'guidon-app/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'guidon-app/src/**'
      - 'guidon-app/tools/**'
      - 'guidon-app/package.json'
      - 'guidon-app/package-lock.json'
      - 'guidon-app/capacitor.config.json'
      - 'guidon-app/ios/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ID: app.guidon.trainer
  CAP_MAJOR: '8'
  DEFAULT_DEVICES: 'iPhone SE (3rd generation),iPhone 16,iPhone 16 Pro Max,iPad (10th generation)'

defaults:
  run:
    shell: bash
    working-directory: guidon-app

jobs:
  webkit:
    name: WebKit pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: guidon-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps webkit chromium
      - name: Static lints
        run: npm run lint:patterns
      - name: Build web bundle
        run: |
          npm run build
          npm run icons
      # The verifiers this workflow trusts, tested themselves. Pure node + bash,
      # a few seconds: the ratchet's verdict logic, the iOS config lint (one
      # planted defect per check) and the Simulator retry wrapper driven by a
      # stub verifier. The wrapper once lost its per-device deadline in a
      # "release:" commit and nothing noticed, because nothing ran it.
      - name: Verifier self-tests
        run: |
          node tools/test-ios-webkit-ratchet.mjs
          node tools/test-ios-config-lint.mjs
          node tools/test-ios-retry-wrapper.mjs

      # This step's exit code IS the job's colour. It used to carry
      # `continue-on-error: true` ("report only, remove once ios:verify exits
      # 0"); that note was later deleted and the job stayed green for weeks
      # while the verifier printed 19 defects and exited 1 - so a brand-new
      # overflow or 12px input would have shipped under the same green tick.
      # The known defects now live in tools/ios-webkit-baseline.json: the run is
      # red for any defect NOT listed there, and red for a listed one that no
      # longer reproduces (delete the entry - the list may only shrink).
      # tools/lint-capacitor-config.mjs check (i) fails if continue-on-error
      # comes back on this step or this job.
      - name: iOS WebKit verification
        run: npm run ios:verify:shots
      - name: Upload WebKit screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-webkit-shots
          path: guidon-app/artifacts/ios-webkit/
          retention-days: 14
          if-no-files-found: warn

  simulator:
    name: Build + Simulator verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: guidon-app/package-lock.json

      - name: Show toolchain
        run: |
          echo "node    $(node -v)"
          echo "npm     $(npm -v)"
          echo "xcode   $(xcodebuild -version | tr '\n' ' ')"
          echo "python  $(python3 --version)"
          echo "sims    $(xcrun simctl list runtimes | grep -c iOS || true) iOS runtime(s)"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        env:
          GUIDON_CAPS_PROBE: '1'
        run: |
          npm run build
          npx playwright install chromium
          npm run icons
          test -f web/index.html

      # @capacitor/ios is a locked dependency, so `npm ci` has already installed
      # the exact version package-lock.json names. There used to be a fallback
      # here that ran an UNPINNED `npm install @capacitor/ios@^8` when it was
      # missing - which would have built (and shipped evidence for) a runtime
      # nobody reviewed. Missing now means the lockfile is wrong: fail.
      - name: Require the locked Capacitor iOS runtime
        run: |
          node -e "
            const want = require('./package-lock.json').packages['node_modules/@capacitor/ios'];
            const got = require('@capacitor/ios/package.json').version;
            if (!want || want.version !== got) { console.error('::error::@capacitor/ios installed ' + got + ' but package-lock.json says ' + (want && want.version)); process.exit(1); }
            if (got.split('.')[0] !== process.env.CAP_MAJOR) { console.error('::error::@capacitor/ios ' + got + ' is not Capacitor major ' + process.env.CAP_MAJOR); process.exit(1); }
            console.log('@capacitor/ios', got, '(as locked)');
          "

      - name: Require maintained iOS project
        run: |
          test -d ios/App/App.xcodeproj || { echo '::error::maintained ios/App/App.xcodeproj is missing'; exit 1; }

      - name: Sync web assets and plugins into iOS
        run: npx cap sync ios

      # What `cap sync` writes is either ignored (ios/.gitignore: public/, the
      # config copies, the Cordova shim - never committed, same as Android) or
      # committed (CapApp-SPM/Package.swift). CI always builds the regenerated
      # copy, so a stale committed one is invisible unless something looks:
      # Package.swift sat at `.iOS(.v15)` next to a 16.2 deployment target from
      # the day the project was added. Must run BEFORE xcodebuild, which writes
      # its own files under ios/. tools/lint-capacitor-config.mjs checks (g)/(h)
      # are the any-OS half of this; check (i) keeps this step in place.
      - name: Committed iOS project matches a fresh sync
        run: |
          drift="$(git status --porcelain -- ios)"
          if [ -n "$drift" ]; then
            echo "::error::npx cap sync ios changed files that are committed (or wrote ones ios/.gitignore does not cover). Run 'npm run ios:sync' and commit the result."
            echo "$drift"
            git --no-pager diff -- ios | head -200
            exit 1
          fi
          echo "ios/ is unchanged by a fresh sync"

      - name: Pick build destination
        id: dest
        run: |
          set -euo pipefail
          python3 tools/ios-pick-simulator.py --selftest
          UDID="$(xcrun simctl list devices available -j | python3 tools/ios-pick-simulator.py --match iPhone)"
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Building against simulator $UDID"

      - name: Build for iOS Simulator
        env:
          DEST_UDID: ${{ steps.dest.outputs.udid }}
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            CONTAINER=(-workspace ios/App/App.xcworkspace)
          else
            CONTAINER=(-project ios/App/App.xcodeproj)
          fi
          if command -v xcbeautify >/dev/null 2>&1; then
            FORMAT=(xcbeautify --renderer github-actions)
          else
            FORMAT=(cat)
          fi
          set -o pipefail
          xcodebuild \
            "${CONTAINER[@]}" \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${DEST_UDID}" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | "${FORMAT[@]}"

      - name: Locate built app
        id: app
        run: |
          set -euo pipefail
          APP_PATH="$(find ios/build/Build/Products -maxdepth 2 -name 'App.app' -type d | head -1)"
          test -n "$APP_PATH" || { echo '::error::App.app not found'; exit 1; }
          echo "path=$PWD/$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Built: $APP_PATH ($(du -sh "$APP_PATH" | cut -f1))"

      - name: Run on Simulators
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
          BUNDLE_ID: ${{ env.APP_ID }}
          DEVICES: ${{ github.event.inputs.devices || env.DEFAULT_DEVICES }}
        run: bash tools/ios-simulator-run-with-retry.sh

      - name: Upload Simulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-simulator-evidence
          path: guidon-app/artifacts/ios/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Simulator capability probes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-simulator-caps
          path: guidon-app/artifacts/ios/**/caps.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload .app for manual inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guidon-ios-simulator-app
          path: ${{ steps.app.outputs.path }}
          retention-days: 30
          if-no-files-found: warn
