name: Apple native config alignment

on:
  push:
    branches: [feat/apple-native-parity]
    paths:
      - '.github/workflows/apple-native-config-fix.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  align:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/apple-native-parity
          fetch-depth: 0

      - name: Align iOS version and deployment floor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('guidon-app/ios/App/App.xcodeproj/project.pbxproj')
          text = p.read_text(encoding='utf-8')
          deployment_count = text.count('IPHONEOS_DEPLOYMENT_TARGET = 15.0;')
          version_count = text.count('MARKETING_VERSION = 1.0;')
          if deployment_count < 2:
              raise SystemExit(f'expected at least 2 iOS deployment settings, found {deployment_count}')
          if version_count != 2:
              raise SystemExit(f'expected exactly 2 native marketing-version settings, found {version_count}')
          text = text.replace('IPHONEOS_DEPLOYMENT_TARGET = 15.0;', 'IPHONEOS_DEPLOYMENT_TARGET = 16.2;')
          text = text.replace('MARKETING_VERSION = 1.0;', 'MARKETING_VERSION = 1.10.0;')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit alignment
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guidon-app/ios/App/App.xcodeproj/project.pbxproj
          git diff --cached --check
          git commit -m 'fix(ios): align v1.10.0 metadata and WebKit floor'
          git push origin HEAD:feat/apple-native-parity