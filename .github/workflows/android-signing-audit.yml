name: Android signing continuity audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit v1.9.0 APK + AAB signer continuity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_SHA256: 83a0cae688a714aa008022d9ab8be5840d327c7b0f6e673e426fe113ed1e1da2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download newest pre-work Android release pair
        run: |
          set -euo pipefail
          mkdir -p /tmp/guidon-signing-audit
          gh release download v1.9.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'GUIDON-1.9.0-android.apk' \
            --pattern 'GUIDON-1.9.0-android.aab' \
            --dir /tmp/guidon-signing-audit
          test -s /tmp/guidon-signing-audit/GUIDON-1.9.0-android.apk
          test -s /tmp/guidon-signing-audit/GUIDON-1.9.0-android.aab

      - name: Extract and compare APK + AAB signer certificates
        run: |
          set -euo pipefail
          APK=/tmp/guidon-signing-audit/GUIDON-1.9.0-android.apk
          AAB=/tmp/guidon-signing-audit/GUIDON-1.9.0-android.aab
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # The GUIDON release certificate is intentionally self-signed, so
          # jarsigner -strict would fail PKIX trust even when the AAB is
          # correctly signed. Verify JAR integrity, then pin the exact cert.
          jarsigner -verify "$AAB"

          apk_digest="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"

          # AABs are JAR-signed. Extract the PKCS#7 signature block from
          # META-INF, decode its signer certificate, and fingerprint that
          # certificate directly. This avoids keytool/JarInputStream quirks
          # seen with Android App Bundle metadata while still validating the
          # real certificate that signed the bundle.
          sig_entry="$(unzip -Z1 "$AAB" | grep -Ei '^META-INF/[^/]+\.(RSA|DSA|EC)$' | head -1)"
          test -n "$sig_entry"
          unzip -p "$AAB" "$sig_entry" > /tmp/guidon-aab-signer.p7b
          openssl pkcs7 -inform DER -in /tmp/guidon-aab-signer.p7b -print_certs -out /tmp/guidon-aab-certs.pem
          openssl x509 -in /tmp/guidon-aab-certs.pem -noout -subject -fingerprint -sha256
          aab_digest="$(openssl x509 -in /tmp/guidon-aab-certs.pem -noout -fingerprint -sha256 | sed -E 's/^sha256 Fingerprint=//I' | tr '[:upper:]' '[:lower:]' | tr -d ':')"

          test -n "$apk_digest"
          test -n "$aab_digest"

          echo "v1.9.0 APK signer SHA-256: ${apk_digest}"
          echo "v1.9.0 AAB signer SHA-256: ${aab_digest}"
          echo "Canonical v1.4.7 signer SHA-256: ${CANONICAL_SHA256}"

          if [ "$apk_digest" != "$CANONICAL_SHA256" ]; then
            echo "::error::v1.9.0 APK signer differs from canonical v1.4.7 signer"
            exit 1
          fi
          if [ "$aab_digest" != "$CANONICAL_SHA256" ]; then
            echo "::error::v1.9.0 AAB signer differs from canonical v1.4.7 signer"
            exit 1
          fi
          if [ "$apk_digest" != "$aab_digest" ]; then
            echo "::error::v1.9.0 APK and AAB were signed by different certificates"
            exit 1
          fi

          echo "Android signer continuity confirmed across v1.4.7 -> v1.9.0 APK -> v1.9.0 AAB"
