    steps:
      - name: Checkout
        # Roadmap audit round 4, "CI / supply-chain hardening" bucket: same
        # SHA-pin-over-mutable-tag fix as the lint-build-verify job's
        # Checkout step above, resolved via `gh api
        # repos/actions/checkout/commits/v4`.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node ${{ env.NODE_VERSION }}
        # Roadmap audit round 4, "CI / supply-chain hardening" bucket: same
        # SHA-pin-over-mutable-tag fix as the Checkout step above, resolved
        # via `gh api repos/actions/setup-node/commits/v4`.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: guidon-app/package-lock.json

      # Roadmap audit round 5, "Dependency & CI/Build Hygiene" bucket: same
      # --omit=optional scoping as the lint-build-verify job's own npm ci
      # step above - this matrix job installs deps fresh in its own runner
      # too, so it would otherwise also run canvas's dead-weight native
      # install script once per chunk for nothing.
      - name: Install dependencies (npm ci)
        run: npm ci --omit=optional

      # tools/test-resize-storm.mjs's first real CI run (2026-09-06) found
      # overflow that never reproduces locally: --font-mono lists "JetBrains
      # Mono", "Cascadia Code", "Consolas", "Roboto Mono" before the generic
      # `monospace` keyword, and a bare ubuntu-latest runner has NONE of the
      # named ones (`npx playwright install --with-deps` below pulls in
      # Chromium's own runtime libs, not brand-name fonts) - so text that
      # renders in the app's intended mono font on every dev/user machine
      # this was ever tested on falls back to whatever generic `monospace`
      # resolves to on this runner, which measurably widens a few
      # mono-font-styled elements (test:resize-storm's #/train diff-badge
      # band, test:resize-storm's 683x768 #/transition shape) just past
      # their container at a handful of narrow widths. Installing the actual
      # first-choice font makes the runner render what a real device would,
      # rather than papering over a font gap with extra CSS slack that would
      # only be correct for THIS substitution. `|| true` via the warning
      # below: a missing/renamed apt package must not fail the whole job
      # over a rendering nicety - the suites above stay the real gate; this
      # only removes a false positive specific to this runner's font set.
      - name: Install JetBrains Mono (matches --font-mono's first choice)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-jetbrains-mono || echo "::warning::fonts-jetbrains-mono unavailable on this runner image - mono-font-width CI/local mismatches may persist"

      - name: Cache Playwright browsers
        # Roadmap audit round 4, "CI / supply-chain hardening" bucket: same
        # SHA-pin-over-mutable-tag fix as the Checkout step above, resolved
        # via `gh api repos/actions/cache/commits/v4`.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('guidon-app/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The same web/+dist/ the lint-build-verify job already built and
      # verified - see the top-of-file note. Almost every test:* suite
      # serves web/ (server.mjs) or reads web/index.html /
      # dist/guidon-standalone.html straight off disk; none run against
      # uncompiled src/.
      - name: Download build output (web/ + dist/)
        # Roadmap audit round 4, "CI / supply-chain hardening" bucket: same
        # SHA-pin-over-mutable-tag fix as the Checkout step above, resolved
        # via `gh api repos/actions/download-artifact/commits/v4`.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-output
          path: guidon-app

      # Each test:* script serves/opens its own fixture from the downloaded
      # build and drives its own Playwright browser instance with zero
      # shared state (see tools/run-parallel.mjs's own header comment), so
      # up to PER_CHUNK (4 as of 2026-09-07) of them can safely run
      # concurrently in this one job.
      - name: Run test chunk (${{ matrix.chunk.name }})
        run: node tools/run-parallel.mjs ${{ matrix.chunk.tests }}
