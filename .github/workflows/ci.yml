name: CI

# GUIDON's first CI pipeline. Automates exactly what `guidon-app`'s own
# `npm test` already runs manually every time: lint:patterns -> build ->
# verify -> the full test:* suite. No new checks are introduced here.
#
# ---------------------------------------------------------------------------
# WHY THIS ISN'T A SINGLE "npm test" STEP (read this before touching batching)
# ---------------------------------------------------------------------------
# guidon-app/package.json's "test" script ends in:
#   node tools/run-parallel.mjs <the full test:* script name list>
# tools/run-parallel.mjs launches every name it's given concurrently (on CI,
# where CI=true, with no cap; locally it defaults to a pool of 6), and most
# of those test:* scripts each spin up their own Playwright/Chromium
# instance. Firing the whole list at once means one Chromium per suite
# (well over a hundred concurrently) - that exhausts RAM/disk even on a
# well-resourced workstation,
# and a standard GitHub-hosted `ubuntu-latest` runner (2 vCPU, ~7 GB RAM) has
# far less headroom than that. A naive `npm test` call here would very
# likely OOM, thrash, or time out. The exact same reasoning is why this
# session's own local practice has never invoked `npm test` as one shot -
# every local run has been manually batched into groups of <=PER_CHUNK
# concurrent test:* scripts (tools/lint-ci-matrix.mjs's own PER_CHUNK: 4
# as of 2026-09-07, down from an unmeasured 8 - see its comment there for
# why: that unmeasured ceiling caused a real, repeat-offender class of CI
# flake).
#
# BATCHING STRATEGY CHOSEN: a GitHub Actions job matrix, not sequential
# batches in one job.
#   - The full test:* name list (the exact set `npm test` itself invokes,
#     in its own order - see note below on test:contrast) is split into
#     chunks of at most PER_CHUNK names each, in package.json order, so
#     only the last chunk is ever short. The chunk block under the `test`
#     job is GENERATED by `node tools/lint-ci-matrix.mjs --write` from
#     package.json's "test" script, and `npm run lint:patterns` fails if
#     the two ever disagree - never hand-edit it. This mirrors this
#     session's own <=PER_CHUNK-concurrent-Chromium local discipline exactly.
#   - Each chunk becomes its own `strategy.matrix` job, each calling
#     `node tools/run-parallel.mjs <that chunk's PER_CHUNK-ish names>` - so
#     the peak concurrent Chromium count per job is identical to what's
#     already been proven safe locally.
#   - Matrix (parallel, isolated jobs) was chosen over "one job, sequential
#     batches" because each matrix entry gets its OWN runner VM with its own
#     dedicated CPU/RAM/disk budget. A single job looping over sequential
#     batches would still cap concurrency at <=PER_CHUNK per batch (also
#     safe from the OOM risk), but every batch would compete for the same
#     one runner's
#     resources for the entire run, any disk/process residue from an earlch
#     batch lingers for the rest of the job, and total wall-clock time is the
#     SUM of all the batches run one after another. The matrix instead runs
#     chunks concurrently across GitHub's own runner fleet (bounded by the
#     account's normal job-concurrency limit, not by us), so wall-clock stays
#     close to a single chunk's time while keeping the same safe per-chunk
#     concurrency ceiling. The repeated per-job setup (checkout/npm ci/
#     Playwright install) this costs in CI-minutes is deliberate: it's cheap,
#     fully parallel, and buys real host-level isolation instead of shared
#     one-VM resource contention across the whole suite.
#   - fail-fast is disabled so one failing chunk doesn't hide results from
#     the other chunks - every chunk's outcome is visible.
#
# lint:patterns, build, and verify run exactly once, in their own job, ahead
# of the test matrix - they're fast (a few seconds to under a minute locally)
# and there is no reason to repeat them once per chunk.
#
# EXCLUDED ON PURPOSE: test:android, test:android:back, test:android:links
# (and any android:* build steps). These require a real device/emulator +
# adb port-forwarding (see package.json's own "_note" on test:android*) that
# this hosted runner does not have. Leaving native/Android verification out
# of this workflow is a deliberate scope decision for this first CI pass, not
# an oversight.
#
# NOTE on test:contrast: guidon-app/package.json defines a `test:contrast`
# script, but `npm test` itself never invokes it (only `test:contrast-full`
# is in the actual test script's run-parallel.mjs argument list - it appears
# to be superseded/subsumed by test:contrast-full). This workflow mirrors
# `npm test` exactly, so `test:contrast` is intentionally NOT included here
# either - adding it would be a new check this workflow invents, not one
# `npm test` already runs.
#
# NOTE on `npm run icons`: verified locally in a genuinely fresh checkout
# (no node_modules, no web/, no dist/) that `npm run build && npm run
# verify` FAILS on a clean clone - build never generates web/icons/*.png (it
# only references those paths), so verify's icon-fetch checks 404 and the
# route sweep picks up the resulting console errors. `npm run icons` must
# run first. This is exactly the "known recurring environment quirk" this
# session hit repeatedly, so it's included below as an explicit step -
# npm run build and npm run verify alone are NOT sufficient in CI.
#
# NOTE on the test matrix needing web/ and dist/: `web/` and `dist/` are
# both gitignored build output, not committed. Checked every tools/test-*.mjs
# file (excluding the excluded android ones): the overwhelming majority call
# `serve("web")` (server.mjs serving the built web/ bundle) and the rest read
# built output directly - test-standalone.mjs and test-native-download.mjs/
# test-print-native.mjs load dist/guidon-standalone.html (the latter two via
# a file:// URL), test-csp.mjs reads web/index.html straight off disk. There
# is no test:* suite that runs against src/ instead of built output. So the
# test-matrix jobs below cannot just install deps and go - they need the
# SAME web/+dist/ the lint-build-verify job already built and verified.
# Rather than re-running `npm run icons && npm run build` in every matrix job
# (redundant work, and a small risk of testing against a *different* build
# than the one verify actually checked), the setup job uploads web/+dist/ as
# a single build artifact and every matrix job downloads it before running
# its chunk. This also means a matrix job failure can never be "verify
# passed against a build these tests never actually saw."

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same PR/branch so redundant jobs don't queue
# up and burn concurrent-job slots that the test matrix needs. Runs on main
# are never cancelled once started (branches[]) triggers push on main,
# ref is refs/heads/main - excluded from cancellation).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Session's local dev environment uses Node 24; by this repo's current
  # date (2026-08) Node 24 is Active LTS (entered LTS Oct 2025), so it's
  # both the locally-matching version and a real, currently-supported
  # stable choice - not a moving "latest" target.
  NODE_VERSION: "24"

defaults:
  run:
    working-directory: guidon-app

jobs:
  # ---------------------------------------------------------------------
  # Fast, cheap, run-once checks: static lint, build, and the Playwright-
  # based build/PWA verification harness. Gates the (much more expensive)
  # test matrix below via `needs:`.
  # ---------------------------------------------------------------------
  lint-build-verify:
    name: lint + build + verify
    runs-on: ubuntu-latest
    # Locally (24-core/33GB dev box, so treat as a floor not a ceiling):
    # lint:patterns <1s, icons ~2s, build ~1.5s, verify ~51s (single
    # Chromium instance doing a sequential 6-viewport x 37-route sweep).
    # Add checkout + setup-node + npm ci + `playwright install --with-deps
    # chromium` (can itself take 1-3 min cold on a fresh runner) and 15
    # minutes leaves comfortable headroom without being an unbounded hang.
    timeout-minutes: 15
    steps:
      - name: Checkout
        # Roadmap audit round 4, "CI / supply-chain hardening" bucket: pinned
        # to the immutable commit SHA behind the v4 tag (resolved via `gh api
        # repos/actions/checkout/commits/v4`) instead of the mutable tag
        # itself. A publisher-mutable tag lets whoever controls the upstream
        # repo (or anyone who compromises their account/token) silently
        # retarget "v4" to different, potentially malicious code that every
        # workflow referencing "@v4" then runs on its next trigger with no
        # diff for anyone to review - the exact supply-chain vector behind
        # real published incidents (e.g. the 2025 tj-actions/changed-files
        # compromise). A SHA is content-addressed and can never be
        # repointed, so this workflow always runs the exact code that was
        # reviewed here. The version is kept as a trailing comment purely for
        # human readability; the SHA is what actually gets executed.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node ${{ env.NODE_VERSION }}
        # Roadmap audit round 4, "CI / supply-chain hardening" bucket: same
        # SHA-pin-over-mutable-tag fix as the Checkout step above, resolved
        # via `gh api repos/actions/setup-node/commits/v4`.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: guidon-app/package-lock.json

      # Roadmap audit round 5, "Dependency & CI/Build Hygiene" bucket: scoped
      # --omit=optional to CI's npm ci specifically, not to package.json/
      # .npmrc project-wide. canvas@2.11.2 (pdfjs-dist's own unused
      # optionalDependency - see package.json's _pdfjs_dist_note and
      # _overrides_note) is optional:true + hasInstallScript:true +
      # dev:true in package-lock.json, so an unscoped `npm ci` runs its
      # native-binary install script on every single CI job that installs
      # deps for nothing: this file never runs `cargo build`/`tauri build`/
      # `tauri dev` in any job (grepped the whole workflow to confirm), so
      # nothing here ever touches canvas or Node-side pdfjs-dist. Per
      # package.json's own _overrides_note, a project-wide --omit=optional
      # is deliberately avoided because @tauri-apps/cli's platform-specific
      # native binaries are ALSO optionalDependencies and desktop:dev/
      # desktop:build (which DO need them) run locally, outside this
      # workflow - so scoping the flag to just these CI steps gets the
      # skip-canvas's-install-script win without touching that local-build
      # tradeoff at all.
      - name: Install dependencies (npm ci)
        run: npm ci --omit=optional

      # npm's own advisory database against the resolved lockfile. Runs the
      # FULL audit (no --omit=dev) on purpose - a prior version of this step
      # scoped out devDependencies on the theory that a vulnerable dev tool
      # never ships in the built web/+dist/ output, but that scoping made
      # the step structurally blind to 3 real advisories (a critical
      # node-tar hardlink/symlink chain plus a high deprecated-package
      # finding) that lived entirely inside devDependencies the whole time
      # (pulled in by canvas, pdfjs-dist's own unused optional dependency -
      # see package.json's overrides/_overrides_note for the actual fix).
      # The audit step meant to catch exactly this kind of drift instead
      # hid it from every run. NON-BLOCKING for the same reason
      # audit:freshness above is: this is a discovery/report step surfacing
      # drift for a human to triage, not a gate.
      - name: npm audit (non-blocking)
        run: npm audit
        continue-on-error: true

      # Cache the downloaded Chromium binary across runs (keyed on the
      # pinned Playwright version + lockfile) so repeated CI runs, and the
      # other test-matrix jobs in this workflow, aren't all re-downloading it cold.
      # Purely a speed/bandwidth optimization - correctness never depends
      # on the cache hitting, `playwright install` below is a no-op if the
      # requested browser is already present and installs it fresh otherwise.
      - name: Cache Playwright browsers
        # Roadmap audit round 4, "CI / supply-chain hardening" bucket: same
        # SHA-pin-over-mutable-tag fix as the Checkout step above, resolved
        # via `gh api repos/actions/cache/commits/v4`.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('guidon-app/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint patterns
        run: npm run lint:patterns

      # Freshness cross-reference (tools/audit-content-freshness.mjs):
      # reports whether any content item carrying a verifiedAgainst tag has
      # gone stale relative to its currency.js domain's real current asOf
      # date. Reads src/index.html + src/app-modules/currency.js directly,
      # so it needs neither the built web/+dist/ output nor a browser -
      # runs fine right after checkout, before Generate icons/Build below.
      # NON-BLOCKING ON PURPOSE (matches the Engineering Systems pitch:
      # "non-blocking initially, until there's real coverage to make it
      # meaningful") - this is a discovery/report tool, not a gate. The
      # script itself always exits 0 even when it finds stale items (a
      # human decides what a stale finding means); continue-on-error here
      # is a second, visible layer of the same guarantee at the workflow
      # level, not a workaround for a script that can fail.
      - name: Content freshness cross-reference (non-blocking)
        run: npm run audit:freshness
        continue-on-error: true

      # Must run before build/verify - see the top-of-file note. build.mjs
      # only ever *references* icon paths, it never generates the PNGs;
      # without this, verify's icon-fetch checks 404 in any fresh checkout.
      - name: Generate icons
        run: npm run icons

      - name: Build
        run: npm run build

      - name: Verify (PWA/build harness)
        run: npm run verify

      # Collective P2: merge the probe file verify just wrote (artifacts/caps/
      # chromium-web.json, the evidence column) into docs/generated/
      # capability-matrix.{md,json}; exits non-zero when a required
      # capability is absent on an evidence column or no evidence exists.
      - name: Capability matrix (registry x probe files)
        run: npm run caps:matrix

      - name: Upload capability matrix
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: capability-matrix
          path: |
            guidon-app/docs/generated
            guidon-app/artifacts/caps
          retention-days: 30
          if-no-files-found: warn

      # room-tls-and-discovery-pitch.md Section 3, "The networking-
      # capabilities floor": the SECOND, deliberately destructive
      # measurement lane next to G.caps's cheap existence probes above -
      # a REAL hello->welcome round trip per fork, not "does the API
      # exist". web and pwa need nothing this runner lacks (a real Node
      # room-server.mjs on loopback + the real Playwright Chromium already
      # installed above), so both run for real on every PR, same spirit as
      # the Capability matrix step just above.
      - name: Network floor (web + pwa, real hello->welcome round trip)
        run: npm run netfloor:web && npm run netfloor:pwa

      # NON-BLOCKING, deliberately: lint-network-floor.mjs's expectation
      # table also expects tauri and android, and this hosted ubuntu
      # runner can produce neither (no Windows Tauri build, no physical
      # Android device) - the exact same gap this workflow's own top-of-
      # file note already documents for test:android*/EXCLUDED ON
      # PURPOSE. The gate must still run and report honestly ("gate on
      # staleness/absence, never fabricate a CI-only measurement" - the
      # pitch doc's own rule): continue-on-error surfaces that real,
      # permanent gap on every PR without ever blocking one on a
      # measurement this environment cannot make, matching the npm
      # audit / cargo audit non-blocking steps elsewhere in this file.
      - name: Network floor gate (non-blocking - tauri/android need real hardware)
        run: npm run lint:network-floor
        continue-on-error: true

      - name: Upload network floor artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: network-floor
          path: guidon-app/artifacts/net-floor
          retention-days: 30
          if-no-files-found: warn

      # Shared with every test-matrix job below - see the top-of-file note
      # on why the matrix downloads this instead of rebuilding once per chunk.
      # web/docs/ (the Reference Library's ~78MB of source PDFs, copied in
      # by build.mjs) is excluded: verified no tools/test-*.mjs suite reads
      # web/docs or docs-source at all, so shipping it through the artifact
      # would be ~78MB of dead weight uploaded once and downloaded by
      # every matrix job for nothing.
      - name: Upload build output (web/ + dist/)
        # Roadmap audit round 4, "CI / supply-chain hardening" bucket: same
        # SHA-pin-over-mutable-tag fix as the Checkout step above, resolved
        # via `gh api repos/actions/upload-artifact/commits/v4`.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-output
          path: |
            guidon-app/web
            guidon-app/dist
            !guidon-app/web/docs/**
          retention-days: 1

  # ---------------------------------------------------------------------
  # RustSec advisory scan for the Tauri desktop build's dependency tree
  # (guidon-app/src-tauri). Independent of and parallel with
  # lint-build-verify - cargo audit only needs the checked-in Cargo.lock,
  # not a built web/+dist/ output, so there's no reason to serialize it
  # behind the npm build. Roadmap-week audit finding: this project's
  # RustSec posture (see src-tauri/Cargo.toml's own tracked-advisory
  # comment) was reviewed entirely by hand with no CI step to catch drift
  # - and a wrong advisory ID cited in that very comment, found the same
  # audit pass, is direct evidence hand-tracking alone had already drifted
  # from ground truth. Installs the prebuilt cargo-audit binary (not
  # `cargo install --locked`, which compiles from source and costs several
  # minutes per run) via taiki-e/install-action, a standard binstall-style
  # action for exactly this.
  # ---------------------------------------------------------------------
  cargo-audit:
    name: cargo audit (src-tauri)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # Roadmap audit round 4, "CI / supply-chain hardening" bucket: same
        # SHA-pin-over-mutable-tag fix as the lint-build-verify job's
        # Checkout step above, resolved via `gh api
        # repos/actions/checkout/commits/v4`.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install cargo-audit
        # Roadmap audit round 4, "CI / supply-chain hardening" bucket: same
        # SHA-pin-over-mutable-tag fix as the Checkout step above (see the
        # lint-build-verify job), resolved via `gh api
        # repos/taiki-e/install-action/commits/cargo-audit`. Unlike the
        # actions/* pins, "cargo-audit" here isn't a semver tag - it's
        # install-action's own per-tool moving tag that gets repointed
        # whenever a new cargo-audit release ships, so there's no "v4.x.x"
        # equivalent to note; the trailing comment instead records the date
        # this SHA was resolved so a future bump is easy to reason about.
        uses: taiki-e/install-action@55ed588c2f0e092949af25ad4c5873185e476b5c  # cargo-audit tag, resolved 2026-08-31

      # NON-BLOCKING for the same reason npm audit above is: this project's
      # own tracked-advisory comment already documents every current
      # finding (2 informational glib/gtk entries that don't even resolve
      # for the shipped Windows target, and 5 informational "unmaintained"
      # unic-* entries with no patched version available upstream) as
      # reviewed and low-risk, not something a red CI check should force
      # action on today. This makes newly-published advisories visible on
      # every PR instead of only at the next manual review pass.
      - name: cargo audit (non-blocking)
        working-directory: guidon-app/src-tauri
        run: cargo audit
        continue-on-error: true

  # ---------------------------------------------------------------------
  # Roadmap audit round 5, "Dependency & CI/Build Hygiene" bucket: cargo
  # audit above only ever reads Cargo.lock's crate-version list against the
  # RustSec advisory DB - it never resolves Cargo.toml against Cargo.lock
  # and never invokes rustc, so it cannot catch a stale/out-of-sync
  # lockfile or a dependency bump that simply fails to compile. Grepped the
  # whole workflow before adding this: no job here ever ran `cargo build`/
  # `cargo check`/`tauri build`/`tauri dev`, so this project's Rust
  # dependency tree had never once been compiled by CI. `cargo check
  # --locked` is used instead of `cargo build`: --locked fails immediately
  # if Cargo.lock and Cargo.toml have drifted (one bumped without
  # regenerating the other) rather than silently re-resolving, and `check`
  # skips codegen entirely - the fast compile-and-drift-check this job
  # exists for, not a full release build (that stays desktop:build, run
  # locally/at release time, never in this workflow - same "out of scope
  # for a hosted CI pass" reasoning as the top-of-file EXCLUDED ON PURPOSE
  # note for Android).
  #
  # runs-on windows-latest, not ubuntu-latest like every other job here:
  # tauri.conf.json's own bundle.targets is ["nsis", "msi"] only, and
  # Cargo.toml's own tracked-advisory comment already establishes "this
  # project only ships a Windows desktop build (no Linux target in CI or
  # in tauri.conf.json)". On Linux, Tauri's webkit2gtk/gtk3 sys-crate build
  # scripts need real system packages (libwebkit2gtk, libgtk-3, etc.)
  # installed via apt before `cargo check` can even run them - packages
  # this repo has never needed and has no existing install step for
  # anywhere. windows-latest compiles against the actual shipped target
  # with zero extra system-dependency setup, keeping this the "lightweight"
  # check the finding asked for instead of growing into a new Linux
  # packaging concern. GitHub-hosted windows-latest runners ship a Rust
  # toolchain already (see actions/runner-images' documented software
  # list), so no separate toolchain-install step is needed here either.
  # ---------------------------------------------------------------------
  cargo-check:
    name: cargo check --locked (src-tauri)
    needs: lint-build-verify
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # Roadmap audit round 4, "CI / supply-chain hardening" bucket: same
        # SHA-pin-over-mutable-tag fix as the lint-build-verify job's
        # Checkout step above, resolved via `gh api
        # repos/actions/checkout/commits/v4`.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Roadmap audit round 5, "Dependency & CI/Build Hygiene" bucket, own
      # follow-up fix: this job's first CI run failed - `cargo check` invokes
      # `tauri::generate_context!()` at COMPILE time (src-tauri/src/main.rs's
      # own .run(tauri::generate_context!()) call), and that proc macro reads
      # tauri.conf.json's frontendDist ("../web", i.e. guidon-app/web/) right
      # then - "error: proc macro panicked ... The `frontendDist`
      # configuration is set to `"../web"` but this path doesn't exist". This
      # job only ever checked out source, it never built web/ - added
      # needs:lint-build-verify above and download the exact same
      # build-output artifact the test matrix jobs already consume below,
      # rather than re-running a second, redundant `npm ci && npm run build`
      # on a Windows runner (heavier: full Node/Playwright toolchain setup
      # for a step that only needs the already-built HTML to exist on disk).
      - name: Download build output (web/ + dist/)
        # Roadmap audit round 4, "CI / supply-chain hardening" bucket: same
        # SHA-pin-over-mutable-tag fix as the Checkout step above, resolved
        # via `gh api repos/actions/download-artifact/commits/v4`.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-output
          path: guidon-app

      - name: cargo check --locked
        working-directory: guidon-app/src-tauri
        # `cargo --version`/`rustc --version` printed first, for diagnosis:
        # this job has failed repeatedly with "cannot update the lock file
        # ... because --locked was passed" while the identical Cargo.lock/
        # Cargo.toml pass `cargo check --locked` cleanly every time locally
        # (cargo 1.96.0), including after a forced fresh crates.io index
        # fetch. There is no rust-toolchain.toml and no explicit toolchain-
        # install step here, so this runs whatever cargo happens to be
        # preinstalled on the windows-latest runner image - a moving target.
        # Knowing the actual version is the fastest way to find out whether
        # that's the real variable, rather than guessing further blind.
        run: |
          cargo --version
          rustc --version
          cargo check --locked --features fuzz-validate

  # ---------------------------------------------------------------------
  # Roadmap audit round 4, "CI / supply-chain hardening" bucket: OSV.dev
  # vulnerability scan for the Android/Gradle dependency tree
  # (guidon-app/android). Before this job, npm had npm audit above and the
  # Tauri desktop build's Rust tree had cargo-audit above, but the
  # androidx.*/Capacitor native AAR tree that guidon-app/android/**/
  # build.gradle pulls in had zero automated CVE scanning of any kind -
  # the same shape of gap npm audit and cargo audit already close for
  # their own ecosystems, just left open for this one. Independent of and
  # parallel with every other job here - it only needs the checked-in
  # Gradle build files, not a built web/+dist/ output or a Rust toolchain.
  # google/osv-scanner-action is the low-friction choice: OSV.dev-backed
  # (no separate account/API key to provision), a single Docker-based
  # action, and it mirrors cargo-audit's own shape exactly - one checkout,
  # one scan step, non-blocking. Scoped to guidon-app/android specifically
  # (not --recursive over the whole repo) so it doesn't re-scan the same
  # npm/Cargo lockfiles the other two jobs already own.
  #
  # COVERAGE CAVEAT, read before treating this as equivalent to cargo-audit:
  # OSV-Scanner's Java/Gradle extractor reads gradle.lockfile /
  # buildscript-gradle.lockfile / gradle/verification-metadata.xml (or
  # pom.xml) - it does not resolve versions out of build.gradle /
  # variables.gradle text directly the way `cargo audit` reads Cargo.lock.
  # This project's Gradle build does not turn on Gradle's own dependency
  # locking anywhere under android/ (no lockfile of any of those names
  # exists), so today this step has no resolved lockfile to scan against
  # and will not yet catch a vulnerable *transitive* androidx/Capacitor
  # version. Turning on dependency locking (`./gradlew :app:dependencies
  # --write-locks` after a real `npx cap sync android`, then committing the
  # resulting lockfiles) would close that gap fully, but doing it correctly
  # needs a working Android SDK + Capacitor sync in CI, which is a
  # meaningfully bigger change than "add a scan job" - out of scope for
  # this pass and flagged here rather than silently shipping a scan that
  # looks like full coverage but isn't yet.
  # ---------------------------------------------------------------------
  android-osv-scan:
    name: OSV-Scanner (android/ dependency tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # Roadmap audit round 4, "CI / supply-chain hardening" bucket: same
        # SHA-pin-over-mutable-tag fix as the lint-build-verify job's
        # Checkout step above, resolved via `gh api
        # repos/actions/checkout/commits/v4`.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # NON-BLOCKING for the same reason npm audit and cargo audit above
      # are: first-pass discovery for a human to triage, not a gate yet -
      # see this job's own top comment for why coverage is partial today.
      - name: OSV-Scanner (android/, non-blocking)
        # Pinned to the immutable commit the "v2.5.1" tag resolves to (`gh
        # api repos/google/osv-scanner-action/commits/v2.5.1`), same
        # mutable-tag concern as every actions/* pin above.
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67  # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./guidon-app/android
        continue-on-error: true

  # ---------------------------------------------------------------------
  # The full test:* matrix, chunked to <=PER_CHUNK (tools/lint-ci-matrix.mjs;
  # 4 as of 2026-09-07, down from an unmeasured 8 - see that file's own
  # PER_CHUNK comment) concurrent Playwright/Chromium instances per job -
  # see the top-of-file comment for the full reasoning behind matrix-of-
  # chunks over a single sequential job.
  # ---------------------------------------------------------------------
  test:
    name: test (${{ matrix.chunk.name }})
    needs: lint-build-verify
    runs-on: ubuntu-latest
    # Locally, a full PER_CHUNK-name chunk via run-parallel.mjs completed in
    # ~14-15s on a 24-core/33GB dev box (measured at the then-8-wide chunk
    # size; a 4-wide chunk is proportionally lighter); a standard
    # GitHub-hosted runner (2 vCPU, ~7GB
    # RAM) is far more constrained and will run these suites markedly
    # slower. Combined with per-job checkout/npm ci/Playwright-install
    # overhead (the same as the setup job above), 15 minutes gives real
    # margin without masking a genuinely hung suite for an hour.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        chunk:
          # GENERATED BLOCK - do not hand-edit. Produced by
