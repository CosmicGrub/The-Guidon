name: OPSEC Harmonization

on:
  pull_request:
    paths:
      - 'guidon-app/src/**'
      - 'guidon-app/tools/test-opsec-harmonization.mjs'
      - 'GUIDON_COMMAND_LEGAL_PACKAGE.md'
      - '.github/workflows/opsec-harmonization.yml'
  push:
    branches: [feature/opsec-cyber-legal-harmonization]
    paths:
      - 'guidon-app/src/**'
      - 'guidon-app/tools/test-opsec-harmonization.mjs'
      - 'GUIDON_COMMAND_LEGAL_PACKAGE.md'
      - '.github/workflows/opsec-harmonization.yml'

permissions:
  contents: read

jobs:
  opsec-harmonization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: OPSEC / Cybersecurity / Legal harmonization gate
        working-directory: guidon-app
        run: node tools/test-opsec-harmonization.mjs
      - name: Existing static regression guard
        working-directory: guidon-app
        run: node tools/lint-patterns.mjs
