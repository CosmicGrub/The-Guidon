name: OPSEC Harmonization Apply

on:
  push:
    branches: [feature/opsec-cyber-legal-harmonization]
    paths:
      - '.github/workflows/opsec-harmonization-inspect.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/opsec-cyber-legal-harmonization
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Apply deterministic OPSEC integration patch
        run: node guidon-app/tools/apply-opsec-harmonization.mjs
      - name: Remove one-shot helpers and commit
        shell: bash
        run: |
          git rm .github/workflows/opsec-harmonization-inspect.yml guidon-app/tools/apply-opsec-harmonization.mjs
          git config user.name "CosmicGrub"
          git config user.email "ctsolomon95@gmail.com"
          git add guidon-app/src/index.html guidon-app/src/app-modules/moi-import.js guidon-app/src/app-modules/leader.js guidon-app/src/app-modules/studygroup.js
          git commit -m "feat(opsec): enforce sensitive-input and network boundaries"
          git push origin HEAD:feature/opsec-cyber-legal-harmonization
