name: Repair PR176 release-note delimiter

on:
  push:
    branches: [release/v1.10.1]
    paths:
      - '.github/workflows/fix-pr176-release-note-comma.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v1.10.1
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: guidon-app/package-lock.json
      - name: Repair delimiter and validate runtime build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('guidon-app/src/index.html')
          s = p.read_text()
          bad = '''        ]\n      }\n          {\n        version: "1.10.1",'''
          good = '''        ]\n      },\n      {\n        version: "1.10.1",'''
          if s.count(bad) != 1:
              raise SystemExit(f'expected one malformed release-note boundary, found {s.count(bad)}')
          s = s.replace(bad, good, 1)
          # Normalize the array close indentation created by the earlier move.
          s = s.replace('      },\n],\n    // guidon:whatsnew:v1', '      },\n    ],\n    // guidon:whatsnew:v1', 1)
          p.write_text(s)
          PY
          cd guidon-app
          npm ci --omit=optional
          npx playwright install --with-deps chromium
          npm run lint:patterns
          npm run build
          npm run verify
          cd ..
          rm .github/workflows/fix-pr176-release-note-comma.yml
          git config user.name 'CosmicGrub'
          git config user.email 'ctsolomon95@gmail.com'
          git add guidon-app/src/index.html .github/workflows/fix-pr176-release-note-comma.yml
          git commit -m 'fix(release): repair v1.10.1 release-note syntax'
          git push origin HEAD:release/v1.10.1
