name: Patch PR177 expanded-search tests

on:
  push:
    branches: [content/92a-promotion-board-supplement]
    paths:
      - '.github/workflows/patch-pr177-search-tests.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: content/92a-promotion-board-supplement
      - name: Patch search tests against uncapped totals
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('guidon-app/tools/test-misc-routes.mjs')
          s = p.read_text()
          old = '''const search92 = await page.evaluate(() => ({
            countText: (document.querySelector(".search-count") || {}).textContent || "",
            hits: [...document.querySelectorAll(".search-hit-title")].map((n) => n.textContent || ""),
            heads: [...document.querySelectorAll(".search-section-head")].map((n) => n.textContent || ""),
            hitCount: document.querySelectorAll(".search-hit").length,
          }));
          const renderedCount = Number((search92.countText.match(/\\d+/) || [0])[0]);
          (renderedCount === search92.hitCount && renderedCount > 1)
            ? ok(`Search "92a": count (${renderedCount}) matches the expanded cross-curriculum result set`)
            : bad(`Search "92a": countText="${search92.countText}", rendered hits=${search92.hitCount}`);'''
          new = '''const search92 = await page.evaluate(() => ({
            countText: (document.querySelector(".search-count") || {}).textContent || "",
            hits: [...document.querySelectorAll(".search-hit-title")].map((n) => n.textContent || ""),
            heads: [...document.querySelectorAll(".search-section-head")].map((n) => n.textContent || ""),
            hitCount: document.querySelectorAll(".search-hit").length,
            segTitles: [...document.querySelectorAll(".search-dist-seg")].map((n) => n.title || ""),
          }));
          const totalCount92 = Number((search92.countText.match(/\\d+/) || [0])[0]);
          const distributedCount92 = search92.segTitles.reduce((sum, title) => {
            const m = /^(\\d+)/.exec(title.trim());
            return sum + (m ? Number(m[1]) : 0);
          }, 0);
          (totalCount92 === distributedCount92 && totalCount92 >= search92.hitCount && search92.hitCount > 1)
            ? ok(`Search "92a": uncapped total (${totalCount92}) matches the distribution bar and includes the ${search92.hitCount} rendered/capped cards`)
            : bad(`Search "92a": countText="${search92.countText}", distributed=${distributedCount92}, rendered hits=${search92.hitCount}`);'''
          if old not in s:
              raise SystemExit('misc-routes target block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('guidon-app/tools/test-search-dist-bar.mjs')
          s = p.read_text()
          old = '''/* ---- single-domain query: no bar renders (matches old parts.length>1 threshold) ---- */
          // "92A" only ever hits the career/MOS domain (a bare MOS code), same as the
          // dedicated MOS-code regression in test-search-views/test-nav-seed - one
          // domain only, so the old text breakdown never rendered a parenthetical
          // and the bar must not render one either.
          await search("92A");
          const singleDomain = await page.evaluate(() => ({
            cards: document.querySelectorAll(".search-hit").length,
            sections: document.querySelectorAll(".search-section").length,
            bars: document.querySelectorAll(".search-dist-bar").length,
          }));
          (singleDomain.cards > 0 && singleDomain.sections === 1)
            ? (singleDomain.bars === 0
                ? ok(`single-domain query "92A" (${singleDomain.cards} hits, 1 section) renders no distribution bar - matches the old text breakdown's own threshold`)
                : bad(`single-domain query "92A" rendered ${singleDomain.bars} distribution bar(s) - should render none`))
            : bad(`"92A" no longer resolves to exactly one domain (cards=${singleDomain.cards}, sections=${singleDomain.sections}) - test assumption stale`);'''
          new = '''/* ---- single-domain query: no bar renders (matches old parts.length>1 threshold) ---- */
          // "reflective belt" is independently covered in test-misc-routes as one
          // real Doctrine hit, so it remains a stable single-domain threshold check.
          await search("reflective belt");
          const singleDomain = await page.evaluate(() => ({
            cards: document.querySelectorAll(".search-hit").length,
            sections: document.querySelectorAll(".search-section").length,
            bars: document.querySelectorAll(".search-dist-bar").length,
          }));
          (singleDomain.cards === 1 && singleDomain.sections === 1)
            ? (singleDomain.bars === 0
                ? ok('single-domain query "reflective belt" (1 hit, 1 section) renders no distribution bar')
                : bad(`single-domain query "reflective belt" rendered ${singleDomain.bars} distribution bar(s) - should render none`))
            : bad(`"reflective belt" stopped being a single-domain/single-hit query (cards=${singleDomain.cards}, sections=${singleDomain.sections})`);

          /* ---- 92A is now deliberately multi-domain after the curriculum supplement ---- */
          await search("92A");
          const mosExpanded = await page.evaluate(() => ({
            cards: document.querySelectorAll(".search-hit").length,
            sections: [...document.querySelectorAll(".search-section-head")].map((h) => h.textContent || ""),
            bars: document.querySelectorAll(".search-dist-bar").length,
            segTitles: [...document.querySelectorAll(".search-dist-seg")].map((s) => s.title || ""),
            total: (document.querySelector(".search-count") || {}).textContent || "",
          }));
          const mosHasBoard = mosExpanded.sections.some((h) => /Board Questions/i.test(h));
          const mosHasCareer = mosExpanded.sections.some((h) => /MOS/i.test(h));
          (mosExpanded.cards > 0 && mosHasBoard && mosHasCareer && mosExpanded.bars === 1)
            ? ok(`expanded "92A" search spans Board Questions + MOS/Career and renders one distribution bar (${mosExpanded.total})`)
            : bad(`expanded "92A" search did not expose the expected cross-domain bar: ${JSON.stringify(mosExpanded)}`);'''
          if old not in s:
              raise SystemExit('search-dist-bar target block not found')
          p.write_text(s.replace(old, new, 1))
          PY

          git rm .github/workflows/patch-pr177-search-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guidon-app/tools/test-misc-routes.mjs guidon-app/tools/test-search-dist-bar.mjs
          git diff --cached --check
          git commit -m 'test(search): account for expanded 92A curriculum'
          git push origin HEAD:content/92a-promotion-board-supplement
