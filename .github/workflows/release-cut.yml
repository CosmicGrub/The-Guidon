name: Cut release

# Stage 1 of a release. A version bump lands first; changing .release-prep to
# that version then creates the immutable source tag + GitHub Release.
#
# FAN-OUT (fixed 2026-09-23). This job used to leave stage 2 - fanning out
# release-assets.yml/release-apple.yml - to a later push of
# guidon-app/src/.release-trigger, on the theory that push would fire their
# own `tags: ['v*']`/`paths: [.release-trigger]` triggers. It never did:
# GitHub Actions does not start new workflow runs from events authored by
# GITHUB_TOKEN (this job's own tag push included), and .release-trigger sat
# unchanged at v1.10.0 in practice - confirmed empirically, v1.15.0/.3/.4 all
# published with zero assets and no Downloads section, every real fan-out
# since v1.10.1 having actually happened via a human clicking
# workflow_dispatch by hand. workflow_dispatch/repository_dispatch are the
# two exceptions to that GITHUB_TOKEN rule, so the "Create or verify
# release" step below now dispatches both platform workflows directly
# instead of relying on a push trigger neither of them can receive from
# here.
#
# WHAT "GREEN" MEANS HERE (changed 2026-09-18). This job used to check only
# that .release-prep matched package.json, then tag and publish within
# seconds - while CI for the very same push was still minutes from a verdict,
# and with nothing stopping a manual run from any branch. Two version bumps
# (1.11.0, 1.12.0) landed on commits whose CI was red, and this job would
# have tagged either of them without complaint. A version tag is permanent:
# tagging a red commit either burns the number or tempts someone into moving
# the tag. So the order is now
#   1. refuse anything that is not main,
#   2. refuse if the version-bearing files disagree with each other
#      (tools/lint-release-state.mjs --cut),
#   3. WAIT for CI on this exact commit and refuse unless it succeeded
#      (tools/release-gate.mjs; Desktop and iOS must be green too when they
#      ran for this commit),
#   4. only then create the tag and the Release.
# The Release is created with --latest=false on purpose: it has no files yet,
# and the install buttons inside the app download from whichever release is
# marked Latest. release-assets.yml's finalize job marks it Latest once the
# files those buttons need are really attached. (Do NOT switch this to
# --draft: a draft creates no git tag, and both asset workflows check out the
# tag.)

on:
  push:
    branches: [main]
    paths:
      - 'guidon-app/src/.release-prep'
  workflow_dispatch:

permissions:
  contents: write
  # write, not read: needed to dispatch release-assets.yml/release-apple.yml
  # below (workflow_dispatch is one of the two GITHUB_TOKEN exceptions that
  # actually starts another workflow run - see the fan-out note above).
  actions: write

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Tag + GitHub Release
    # workflow_dispatch can be started from any branch; a release is only
    # ever cut from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Most of this is the wait for CI in step 3, not work.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Version files agree and this version was never released
        run: node guidon-app/tools/lint-release-state.mjs --cut

      - name: Require green CI on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node guidon-app/tools/release-gate.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --workflow ci.yml \
            --also desktop.yml,ios.yml \
            --wait-minutes 90

      - name: Create or verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./guidon-app/package.json').version")"
          TAG="v${VERSION}"
          PREP="$(tr -d '\r\n[:space:]' < guidon-app/src/.release-prep)"

          if [ "$PREP" != "$TAG" ]; then
            echo "::error::.release-prep says '$PREP' but package.json says '$TAG'"
            exit 1
          fi

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already points to $TAG_COMMIT, not this release-prep commit $GITHUB_SHA"
              exit 1
            fi
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG release already exists; verified idempotent rerun."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "GUIDON $TAG" \
              --latest=false \
              --generate-notes
          fi

          git fetch --tags --force
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          test "$TAG_COMMIT" = "$GITHUB_SHA" || {
            echo "::error::$TAG resolved to $TAG_COMMIT after creation; expected $GITHUB_SHA"
            exit 1
          }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

          # Explicit dispatch, not the tag push above: GITHUB_TOKEN-authored
          # events never start another workflow's push trigger, so without
          # this the release stays at zero assets until someone remembers
          # to click workflow_dispatch by hand (see the fan-out note at the
          # top of this file).
          echo "Dispatching release-assets.yml and release-apple.yml for $TAG..."
          gh workflow run release-assets.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
          gh workflow run release-apple.yml --repo "$GITHUB_REPOSITORY" --ref main
