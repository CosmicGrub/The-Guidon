name: Apple platform bootstrap

on:
  push:
    branches: [feat/apple-native-parity]
    paths:
      - '.github/workflows/apple-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  bootstrap:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Apple parity branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/apple-native-parity
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: guidon-app/package-lock.json

      - name: Repair v1.10.0 release notes and manifest description
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('guidon-app/src/index.html')
          text = p.read_text(encoding='utf-8')
          if 'version: "1.10.0"' not in text and "version: '1.10.0'" not in text:
              marker = 'RELEASE_NOTES: ['
              start = text.find(marker)
              if start < 0:
                  raise SystemExit('could not locate G.whatsNew.RELEASE_NOTES')
              open_bracket = text.find('[', start)
              depth = 0
              quote = None
              escaped = False
              close_bracket = None
              for i in range(open_bracket, len(text)):
                  ch = text[i]
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ('"', "'", '`'):
                      quote = ch
                      continue
                  if ch == '[':
                      depth += 1
                  elif ch == ']':
                      depth -= 1
                      if depth == 0:
                          close_bracket = i
                          break
              if close_bracket is None:
                  raise SystemExit('could not find end of G.whatsNew.RELEASE_NOTES')

              entry = '''      {
        version: "1.10.0",
        date: "September 2026",
        title: "Board readiness and better study rooms",
        highlights: [
          "Study Rooms can now build multi-category decks, with new Scenario Relay and Collective Decision ways to train together.",
          "Board Drill adds 5-Minute Board Reps plus quick filters by regulation and readiness pillar, with readiness rollups by pillar.",
          "The board and doctrine library adds verified counseling, training, AER, ACS, SUDCC, and operational-thinking material with clearer organization."
        ]
      }'''
              before = text[:close_bracket].rstrip()
              sep = ',\n' if before and before[-1] == '}' else '\n'
              text = before + sep + entry + '\n    ' + text[close_bracket:]
              p.write_text(text, encoding='utf-8')

          pkg = Path('guidon-app/package.json')
          s = pkg.read_text(encoding='utf-8')
          s = s.replace('installable PWA bundle, standalone single file, Windows desktop app, Android app',
                        'installable PWA bundle, standalone single file, Windows/macOS desktop app, Android/iOS app')
          pkg.write_text(s, encoding='utf-8')
          PY

      - name: Install first-class iOS platform dependency
        working-directory: guidon-app
        run: npm install --save '@capacitor/ios@8.5.1'

      - name: Generate maintained Capacitor iOS project
        working-directory: guidon-app
        run: |
          if [ ! -d ios/App ]; then
            npx cap add ios
          fi
          npm run build
          npx cap sync ios

      - name: Verify release-note and Capacitor lint gates
        working-directory: guidon-app
        run: npm run lint:patterns

      - name: Commit generated iOS platform
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guidon-app/package.json guidon-app/package-lock.json guidon-app/src/index.html
          git add -f guidon-app/ios ':!guidon-app/ios/App/App/public' ':!guidon-app/ios/App/Pods' ':!guidon-app/ios/App/build' ':!guidon-app/ios/App/DerivedData'
          if git diff --cached --quiet; then
            echo 'No bootstrap changes to commit.'
            exit 0
          fi
          git commit -m 'feat(apple): commit maintained Capacitor iOS target'
          git push origin HEAD:feat/apple-native-parity