// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        // Roadmap audit round 5, "Dependency & CI/Build Hygiene" bucket:
        // removed the unconditional `classpath 'com.google.gms:google-
        // services:4.5.0'` that used to sit here. app/build.gradle only
        // ever applies the com.google.gms.google-services PLUGIN inside a
        // try/catch gated on app/google-services.json existing - and no
        // such file exists anywhere under android/ (confirmed via a repo
        // search), nor does any push-notification/Firebase feature exist
        // in this codebase (no @capacitor/push-notifications dependency,
        // no FirebaseMessaging usage anywhere). The classpath was being
        // resolved from Maven on every single Android Gradle invocation
        // for a plugin whose only consumer condition can never be true
        // today. If push notifications are ever actually implemented, add
        // this classpath back here alongside committing the real
        // google-services.json that app/build.gradle's try block already
        // expects.
        // Baseline Profile Gradle plugin (id "androidx.baselineprofile"), applied
        // to :baselineprofile (com.android.test, generator) and :app (consumer).
        // This project uses the legacy buildscript+"apply plugin" style
        // throughout (no plugins{} DSL/version catalog), so the plugin id
        // resolves off this classpath entry the same way com.android.application
        // already does above.
        //
        // Version hardcoded (not read from variables.gradle's ext) because
        // buildscript{} always evaluates before "apply from: variables.gradle"
        // below runs - ext.baselineProfileGradlePluginVersion doesn't exist yet
        // at this point in the script. Keep this literal in sync with
        // variables.gradle's baselineProfileGradlePluginVersion by hand; it's
        // the same constraint com.android.tools.build:gradle's own hardcoded
        // 8.13.0 above already lives under.
        classpath 'androidx.benchmark:benchmark-baseline-profile-gradle-plugin:1.4.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
