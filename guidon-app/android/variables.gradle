ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    // Baseline Profile toolchain (Roadmap Tier 7). Versions verified against
    // Google's real maven-metadata.xml on 2026-08-24 - these are the latest
    // STABLE releases (1.5.0 was still rc01 at the time). The Gradle plugin's
    // own real min-AGP floor (androidx-main Constants.kt,
    // MIN_AGP_VERSION_REQUIRED_INCLUSIVE) is AndroidPluginVersion(8, 0, 0),
    // well under this project's AGP 8.13.0, so no AGP bump is required.
    baselineProfileGradlePluginVersion = '1.4.1'
    benchmarkMacroJunit4Version = '1.4.1'
    profileInstallerVersion = '1.4.1'
    // androidx.test.ext:junit does not transitively expose androidx.test.filters
    // (@LargeTest) on the compile classpath - the generator test needs this
    // declared directly. Same "androidx.test" release train as
    // androidxEspressoCoreVersion (3.7.0) above.
    androidxTestRunnerVersion = '1.7.0'
    // Pulled in transitively by benchmark-macro-junit4 1.4.1 (it now extends
    // androidx.test.uiautomator's UiAutomatorTestScope), declared explicitly
    // anyway since the generator test calls into androidx.test.uiautomator
    // APIs (By/Until) directly to drive real nav-bar taps.
    uiAutomatorVersion = '2.4.0'
}