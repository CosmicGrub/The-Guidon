apply plugin: 'com.android.application'
// Consumes the profile generated by :baselineprofile (see that module's
// build.gradle) and wires it into this module's release build so ART can
// ahead-of-time compile the hot paths it records - Roadmap Tier 7.
apply plugin: 'androidx.baselineprofile'
// RoomTlsPlugin.kt (TLS room-join spike, 2026-09-06): the first in-tree
// Kotlin source :app has ever had - see android/build.gradle's classpath
// comment for why this wasn't needed before (every bundled Capacitor
// plugin ships its Kotlin pre-compiled in its own AAR).
apply plugin: 'kotlin-android'

// Release signing. Loaded from android/keystore.properties, which is
// git-ignored along with keys/ — signing material must never be committed.
// If the file is absent the release build simply stays unsigned rather than
// failing, so a fresh clone can still run assembleDebug.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasSigning = keystorePropertiesFile.exists()
if (hasSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "app.guidon.trainer"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.guidon.trainer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10501
        versionName "1.5.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // RoomTlsPlugin.kt needs a matching JVM target for its Kotlin and Java
    // compile tasks (kotlinc/javac must agree, or compileDebugKotlin fails
    // with "Inconsistent JVM-target compatibility" - hit this for real: AGP
    // 8.13.0 at this project's compileSdk (36) already resolves javac to 21
    // on its own (see tools/android-gradle.mjs's own header comment on WHY
    // - "AGP 8.13.0 at this project's compileSdk resolves a Java toolchain
    // that needs a JDK 21+ compiler"), so kotlinc has to be told 21 too,
    // not left at some other "sounds standard" default.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    signingConfigs {
        if (hasSigning) {
            release {
                // rootProject.file() resolves from android/, not android/app/.
                // Plain file() here would look in android/app/../keys = android/keys.
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
            // The app is one large HTML asset plus Capacitor; there is almost no
            // app Java to shrink, and R8 has repeatedly been a source of
            // hard-to-diagnose release-only breakage in WebView shells.
            // Resource shrinking is left off for the same reason.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // RoomTlsPlugin.kt's own runtime dependency, now that :app compiles
    // Kotlin at all (see the 'kotlin-android' plugin above).
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Actually installs/uses the Baseline Profile at runtime (ART reads it
    // through ProfileInstaller, not automatically just because a profile
    // file exists in the APK) - real required piece of Roadmap Tier 7, not
    // just the :baselineprofile module + generation step.
    implementation "androidx.profileinstaller:profileinstaller:$profileInstallerVersion"
    // Generated by :app:generateBaselineProfile (androidx.baselineprofile
    // plugin, applied above) from the real on-device run of
    // :baselineprofile's BaselineProfileGenerator instrumented test.
    baselineProfile project(':baselineprofile')
}

apply from: 'capacitor.build.gradle'
