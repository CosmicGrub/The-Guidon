# Roadmap audit round 5, "Dependency & CI/Build Hygiene" bucket:
# distributionSha256Sum added below. validateDistributionUrl=true only
# checks the URL's shape/host, never the downloaded zip's actual bytes -
# without this property, a compromise of services.gradle.org/
# downloads.gradle.org or a MITM on the download would silently hand a
# tampered Gradle distribution to every build (local and CI) with nothing
# to catch it; the Gradle wrapper itself refuses to proceed if the
# downloaded zip's SHA-256 doesn't match this value. Hash obtained from
# the distribution's own published checksum file (the standard way to get
# this value - https://downloads.gradle.org/distributions/gradle-8.14.3-all.zip.sha256,
# the same path services.gradle.org redirects to), cross-checked against
# the independently-hosted https://gradle.org/release-checksums/ table for
# the "Complete (-all) ZIP" row - both agree, so this is the real published
# hash, not a fabricated one. Must be updated together with distributionUrl
# any time the Gradle version above is bumped.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionSha256Sum=62c3769155d7d17ea05084ad498067824c1804568a408a6faa78a5ef95ed67a8
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
