[package]
name = "guidon"
version = "1.5.0"
description = "GUIDON - Army Leader Development Trainer"
authors = ["GUIDON"]
edition = "2021"
rust-version = "1.77"
# src/bin/fuzz_validate.rs (the differential fuzzer, room-tls-and-discovery-
# pitch.md section 3) is a second [[bin]] target in this package now.
# Without this, `cargo run` picks ambiguously and - measured this session -
# `tauri build`/`tauri dev` picked fuzz_validate.exe as "the application"
# instead of the real shipped guidon.exe, silently, with no error (only
# `npx tauri build --debug --no-bundle`'s own "Built application at:" line
# gave it away). default-run is Cargo's own, standard field for exactly
# this ambiguity; tauri-cli's own binary discovery respects it, so
# tauri.conf.json (pinned byte-for-byte against HEAD by
# tests/config.rs::tauri_conf_is_byte_identical_to_head_apart_from_the_
# desktop_plan_keys, apart from two named R1 keys) needs no new key and
# stays untouched.
default-run = "guidon"

[lib]
# Split for the differential fuzzer (room-tls-and-discovery-pitch.md
# section 3): src/bin/fuzz_validate.rs is a second [[bin]] target that needs
# to call the real room::validate() through this lib, not a second copy.
# Name defaults to the package name ("guidon"), spelled out here for
# clarity. main.rs still builds the same binary it always did - only reaches
# room/room_schema_gen through `use guidon::{room, room_schema_gen}` now.
name = "guidon"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Raise the existing window instead of starting a second copy that would fight
# over the same IndexedDB.
tauri-plugin-single-instance = "2"
# Remember window size/position/maximised state between runs.
tauri-plugin-window-state = "2"
# R11 self-test report (src/selftest.rs): the page's {routes, themes, hash,
# fork, buildSha} arrive as a typed command argument and leave as one JSON
# file. Both crates were already in Cargo.lock through tauri itself (serde
# 1.0.229, serde_json 1.0.151); this only names them as direct dependencies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# R-ROOM (collective P4): the LAN room listener (src/room.rs) is a tokio
# task on tauri's own async runtime. tokio 1.53.1 was already in Cargo.lock
# through tauri (features rt, rt-multi-thread, sync, fs, io-util); this
# names it directly and adds the "net" (TcpListener/TcpStream) and "time"
# (heartbeat, probe timeout) features. No new crate: net's optional deps
# (mio, socket2, windows-sys) were already resolved in the lock. The
# WebSocket layer is a minimal RFC 6455 server written here to mirror
# tools/room-server.mjs frame for frame (SHA-1 + base64 for the handshake
# are ~60 lines in room.rs, tested against the RFC vectors) - no
# tokio-tungstenite, no sha1 crate, no new dependency of any kind.
# Keep-awake (X13) is one kernel32 FFI declaration, not the windows crate.
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync"] }

# room-tls-and-discovery-pitch.md Section 1 (the pinned self-signed WSS
# design for the Android room-join blocker, confirmed 2026-09-06): a
# second, TLS-wrapped accept loop alongside the existing plaintext one in
# room.rs, sharing the exact same serve_conn/relay logic - never a second
# implementation of it. Exact versions and feature sets the spike
# (src-tauri/spikes/room_tls_spike/) proved compatible together.
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
# NOT free via rcgen - checked, not assumed, and the spike's own comment
# (src-tauri/spikes/room_tls_spike/) claiming otherwise does not hold here:
# `cargo tree -i -p x509-parser` against THIS package's own Cargo.lock
# shows it parented ONLY under `guidon` (this direct dependency), never
# under rcgen. rcgen 0.14's default features (crypto, pem, ring) never pull
# it in; x509-parser sits behind rcgen's own optional, non-default
# "x509-parser" feature, which this project does not enable. Named here
# because room_tls.rs needs its own copy to re-parse OUR OWN freshly-minted
# certificate (see that file's header for why re-parsing, not trusting
# rcgen's own key export, is the whole point) - a real, required dependency
# edge, not a free one.
x509-parser = "0.18"
# SHA-256/hex/base32 for the SPKI pin and the human-read fp are hand-rolled
# in room_tls.rs (same reason room.rs already hand-rolls SHA-1 + base64 for
# the WebSocket handshake instead of depending on a crate for it) - no
# sha2/hex/base32 crate is added here, deliberately, even though sha2
# happens to already be resolved transitively for unrelated reasons.

# Windows-only desktop-shell integration (R3 selective accelerator guard,
# R-ROOM's non-loopback IPv4 listing). Target-gated because both are Win32
# APIs with nothing to bind to elsewhere, even though this project only
# ships a Windows build today (see the cargo-audit notes below).
[target.'cfg(windows)'.dependencies]
# R3: ICoreWebView2Controller::add_AcceleratorKeyPressed. Already resolved
# in Cargo.lock (0.38.2) through tauri-runtime-wry/wry; this only names it
# as a direct dependency so main.rs can call it.
webview2-com = "0.38"
# The plain `windows::core::Result`/`BOOL` webview2-com's own closures need
# - NOT the full `windows` crate (which webview2-com does not re-export):
# `windows::core` is itself a re-export of `windows-core`, already resolved
# at 0.61.2 in Cargo.lock through webview2-com/windows-core itself, so this
# is the same type either way with far fewer features to compile.
windows-core = "0.61"
# R-ROOM: GetAdaptersAddresses (iphlpapi), the same API `ipconfig` is built
# on - real interface enumeration for the non-loopback IPv4 listing.
# windows-sys 0.60 was already resolved in Cargo.lock (tao's own Win32
# calls); this adds the IP-Helper/Ndis/WinSock feature set directly.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
# R13: tauri's "test" feature exposes tauri::test::{mock_builder, mock_context,
# noop_assets, get_ipc_response} and the MockRuntime, so the self-test command
# runs under `cargo test` without a window. Same crate and version as above;
# the feature is unified only into test builds.
tauri = { version = "2", features = ["test"] }

# ---------------------------------------------------------------------------
# Tracked, unfixed transitive advisories (checked 2026-08-13, task #245/#246;
# advisory IDs re-verified 2026-08-30, roadmap-week audit; group 1 broadened
# to cover its full 12-crate closure by name/count 2026-08-30, roadmap-week
# audit 2nd pass — `cargo audit` reports 17 allowed warnings total today,
# matching this comment's 12 (group 1) + 5 (group 2) breakdown exactly)
#
# `cargo audit` now runs non-blocking in CI (.github/workflows/ci.yml,
# "cargo audit (src-tauri)" job) so newly-published advisories surface on
# every PR - but the two informational findings below are still reviewed
# by hand here, since a non-blocking CI check reports drift, it doesn't
# replace judging whether a given "unmaintained"/unreachable-target finding
# needs action. Re-check both groups the next time src-tauri's dependency
# tree moves.
#
# 1) glib/gtk-rs GTK3 bindings and their FULL transitive closure — this
#    entry summarizes by root cause, not by exhaustively naming every leaf
#    crate; `cargo audit` currently reports 12 warnings in this family:
#    glib 0.18.5 itself (RUSTSEC-2024-0429, unsound Iterator/
#    DoubleEndedIterator impl on glib::VariantStrIter — a patched glib
#    >=0.20.0 DOES exist upstream, per the advisory's own [versions] block;
#    a prior version of this comment wrongly said no fix exists anywhere).
#    The real, still-unfixable-from-here blocker is narrower than that: gtk
#    0.18.2's own unmaintained GTK3 bindings (RUSTSEC-2024-0415, covering
#    atk/atk-sys/gdk/gdk-sys/gdkwayland-sys/gdkx11/gdkx11-sys/gtk/gtk-sys/
#    gtk3-macros) pin glib to the 0.18.x line and have never moved past it,
#    so this project can't reach glib's real fix without gtk-rs itself
#    resuming GTK3 maintenance first — confirmed via `cargo tree --target
#    x86_64-unknown-linux-gnu -i glib`, which traces glib 0.18.5 solely
#    through gtk 0.18.2. Also in this family: proc-macro-error
#    (RUSTSEC-2024-0370, unmaintained — a proc-macro dependency of
#    glib-macros/gtk3-macros, so it rides in on the exact same chain).
#    All pulled in transitively as Tauri's Linux windowing backend. Confirmed
#    via `cargo tree -p glib --target x86_64-pc-windows-msvc` (and the same
#    check repeated for proc-macro-error) printing nothing — the crates
#    don't even resolve for this target — vs. `--target
#    x86_64-unknown-linux-gnu` (resolves normally, tracing through
#    glib-macros/gtk3-macros -> glib/gtk -> tauri): this project only ships
#    a Windows desktop build (no Linux target in CI or in tauri.conf.json),
#    so none of these 12 advisories' code ever compiles into, let alone runs
#    in, the shipped binary. No action possible from this project's
#    Cargo.toml either way — every one of these crates is chosen by Tauri
#    itself, conditionally per target, not something GUIDON depends on
#    directly.
#
# 2) unic-* crates — RUSTSEC-2025-0081 (unic-char-property), RUSTSEC-2025-0075
#    (unic-char-range), RUSTSEC-2025-0080 (unic-common), RUSTSEC-2025-0100
#    (unic-ucd-ident), RUSTSEC-2025-0098 (unic-ucd-version) — each is its own
#    advisory ID, not interchangeable; a prior version of this comment cited
#    -0083 and -0104 here, which are unic-ucd-bidi's and unic-ucd-segment's
#    IDs respectively — neither crate is in this project's dependency tree at
#    all (re-confirmed via `cargo audit` against the real Cargo.lock, which
#    flags exactly these 5 crate/ID pairs and nothing else in this family).
#    All five are "unmaintained", not an active exploit. Unlike glib/gtk above, these
#    DO resolve on the real Windows target: `cargo tree -p unic-ucd-ident
#    --target x86_64-pc-windows-msvc -i` traces them through
#    urlpattern -> tauri-utils -> tauri (Tauri's own core dependency chain),
#    not anything GUIDON's Cargo.toml references. Not directly fixable from
#    here — would need Tauri (or urlpattern upstream) to move off the
#    unmaintained rust-unic project onto a maintained Unicode-data crate.
#    Low practical risk (informational "unmaintained" status, not a known
#    vulnerability) but tracked here so it isn't mistaken for an oversight.
# ---------------------------------------------------------------------------

# The app ships to phones and older unit laptops, so the installer is kept small
# and the binary stripped. LTO + one codegen unit costs build time, not runtime.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
