; PlatformIO project file — GUIDON Flashcard OS (ESP32 handheld fork)
;
; Five environments, meant to be flashed in this order for a fresh board:
;   1. probe       - driver-agnostic raw-SPI display ID probe (no TFT_eSPI,
;                    no ILI9341-vs-ST7796 assumption baked in anywhere).
;   2. bringup      - decisive follow-up: drives the panel for real as
;                    ST7796/320x480 and round-trips GRAM pixels near row
;                    470 to confirm it. Both 1 and 2 already ran against
;                    the physical device - see HARDWARE.md for the result
;                    (ST7796S/320x480 confirmed; the ILI9341/240x320 spec
;                    this project started with was wrong).
;   3. sdloader     - one-time utility: pushes cards.ndjson/categories.json
;                    onto the device's microSD over the same USB-serial
;                    link used for flashing (tools/push-to-sd.py), so
;                    getting content onto the card never depended on
;                    having a separate SD card reader.
;   4. touchtest    - diagnostic: prints raw + calibrated touch readings
;                    continuously, and can wipe/redo stored calibration.
;                    Used when taps on the real firmware did nothing -
;                    see HARDWARE.md's "Touch" section for the result.
;   5. flashcardos  - the real, shipped firmware.
;
; Board: generic esp32dev target is correct here, NOT a named dev-kit board
; (no board def exactly matches this handheld). It gets us the right
; toolchain/partition defaults for a bare ESP32-D0WD-V3 module; every pin
; assignment below is this project's own, not the board default's.

[platformio]
default_envs = flashcardos

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; This exact module has NO PSRAM (per HARDWARE.md) - default 4MB flash /
; no-PSRAM partitioning is correct. Do not add -DBOARD_HAS_PSRAM anywhere.
board_build.partitions = default.csv
; Every env below sets build_src_filter explicitly to exactly one +<...cpp>
; (excluding every other src/*_main.cpp / main.cpp file) - each has its own
; setup()/loop(), so building more than one into the same binary is a
; straight link error. Add the new file to every OTHER env's exclusion
; list if a sixth entry point ever gets added here.

[display_flags]
; Shared by any env that actually drives the panel (bringup, touchtest,
; flashcardos). probe and sdloader don't need TFT_eSPI at all - probe
; talks raw SPI on purpose (see probe_main.cpp's header), sdloader only
; touches SD+Serial.
build_flags =
	-DUSER_SETUP_LOADED=1
	; ---- Driver + panel geometry - CONFIRMED against the physical device
	; via env:probe + env:bringup (HARDWARE.md has the full readout). The
	; project's own initial spec ("ILI9341, 240x320") was wrong; the pin
	; table's claim was right.
	-DST7796_DRIVER=1
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	; ---- Pin mapping (confirmed hardware table, HARDWARE.md) ---------
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_MISO=12
	-DTFT_RST=-1        ; tied to EN, not driven by a GPIO
	-DTFT_BL=27
	-DTFT_BACKLIGHT_ON=HIGH
	-DTOUCH_CS=33
	; ---- SPI clock: pushed to the fastest value that still passes the
	; GRAM round-trip test (env:bringup) against the physical device -
	; see HARDWARE.md's "Display SPI clock" section for what was actually
	; tried and what the real ceiling on this unit turned out to be. Not
	; a textbook "safe" number picked without testing it, the same
	; standard the driver/resolution question itself was held to.
	-DSPI_FREQUENCY=80000000
	-DSPI_READ_FREQUENCY=16000000
	; XPT2046 touch: left conservative on purpose. 2.5MHz is already the
	; commonly-cited reliable ceiling for this specific touch controller
	; (unlike the ST7796 display bus, which the hardware tolerates much
	; faster) - touch bring-up (HARDWARE.md's Touch section) confirmed
	; reliable operation at this value, and touch responsiveness is
	; handled in software now (loop()'s edge-triggered touch, not a
	; polling-rate problem), not by pushing this clock further.
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1

[env:probe]
build_src_filter = +<probe_main.cpp> -<main.cpp> -<bringup_main.cpp> -<sdloader_main.cpp> -<touchtest_main.cpp>

[env:bringup]
build_src_filter = +<bringup_main.cpp> -<main.cpp> -<probe_main.cpp> -<sdloader_main.cpp> -<touchtest_main.cpp>
lib_deps = bodmer/TFT_eSPI @ ^2.5.43
build_flags = ${display_flags.build_flags}

[env:sdloader]
build_src_filter = +<sdloader_main.cpp> -<main.cpp> -<probe_main.cpp> -<bringup_main.cpp> -<touchtest_main.cpp>
; No TFT_eSPI, no display build_flags - this firmware only ever touches
; Serial and SD. Keeping it free of the display config means a wrong pin
; define here can never be the reason a content push fails.

[env:touchtest]
build_src_filter = +<touchtest_main.cpp> -<main.cpp> -<probe_main.cpp> -<bringup_main.cpp> -<sdloader_main.cpp>
lib_deps = bodmer/TFT_eSPI @ ^2.5.43
build_flags = ${display_flags.build_flags}

[env:flashcardos]
build_src_filter = +<main.cpp> -<probe_main.cpp> -<bringup_main.cpp> -<sdloader_main.cpp> -<touchtest_main.cpp>
lib_deps =
	bodmer/TFT_eSPI @ ^2.5.43
	bblanchon/ArduinoJson @ ^7.2.1
build_flags = ${display_flags.build_flags}
	; Optional touch diagnostics in src/main.cpp (off by default).
	; Uncomment to log raw vs calibrated touch and draw/read timing:
	; -DDEBUG_TOUCH=1
